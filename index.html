/* Planning evaluation → {blockers[], missing[]} */
function evalPlanning(f){
  const pl=f.planning, blockers=[], missing=[];
  const os=pl.openSky||{}, o2=pl.ok2fly||{};
  // B1 no-fly
  if(os.result==='No-fly'||o2.result==='No-fly') blockers.push({id:'B1',msg:'Airspace app reports No-fly',why:'This location is in restricted airspace. Flight cannot proceed at this location.',fix:'Choose a different location, or re-check both apps.'});
  // B2 approval-required without approval record
  [['openSky',os,'OpenSky'],['ok2fly',o2,'ok2fly']].forEach(([k,a,nm])=>{
    if(a.result==='Approval required'){ const ap=a.approval||{};
      if(!ap.ref||!ap.authority||!ap.date) blockers.push({id:'B2',msg:`${nm}: approval required but not recorded`,why:'Approval-required airspace needs a recorded approval before the plan can be approved.',fix:`Record ${nm} approval reference #, authority and date.`}); }
  });
  // both must return clear or approved
  const okState=r=> r==='Clear — no restrictions'||r==='Approval required';
  if(!okState(os.result)||!okState(o2.result)) missing.push('Both OpenSky and ok2fly must return Clear or Approved');
  // apps disagree
  if(os.result&&o2.result&&os.result!==o2.result) blockers.push({id:'B1',msg:'OpenSky and ok2fly disagree',why:'Treat as the more restrictive result — resolve before approval.',fix:'Re-check both apps and record matching results.'});
  // within 3nm
  if(pl.within3nm){ const anyAppr=(os.approval&&os.approval.ref)||(o2.approval&&o2.approval.ref)||(pl.approvals&&pl.approvals.length);
    if(!anyAppr) blockers.push({id:'B2',msg:'Within 3 NM of controlled aerodrome without approval',why:'This is outside our standard operating conditions and needs an attached approval.',fix:'Record an airspace approval.'}); }
  // B3 scope flags
  const sf=pl.scopeFlags||{}; const scopeMap={above400:'Above 400 ft AGL',night:'Night operation',people:'Over/near people or populous area',bvlos:'BVLOS'};
  Object.keys(scopeMap).forEach(k=>{ if(sf[k]) blockers.push({id:'B3',msg:`${scopeMap[k]} is planned — outside ReOC scope`,why:'This requires CASA approval and a significant change to our ReOC scope. See Change Events.',fix:'Turn this off, or log a significant change and obtain CASA approval.'}); });
  // B5 NOTAM
  if(pl.notams&&pl.notams.restricts) blockers.push({id:'B5',msg:'A NOTAM restricts this flight',why:'An unresolved restricting NOTAM prevents approval.',fix:'Resolve/reschedule and clear the NOTAM restriction.'});
  // B4 high residual hazard
  if((pl.jsa.hazards||[]).some(hz=>hz.risk==='High')) blockers.push({id:'B4',msg:'A JSA hazard has High residual risk',why:'A High residual-risk hazard must be reduced before approval, or the flight replanned.',fix:'Add controls to reduce the hazard to Medium or lower.'});
  // public interference high -> warning requiring mitigation (treated as missing gate item if no mitigation)
  if(pl.site.publicInterference==='High' && !(pl.site.publicMitigation||'').trim()) missing.push('High public-interference likelihood needs a documented mitigation');
  // required completeness
  if(!pl.jsa.done) missing.push('Mark the JSA as completed');
  if(!(pl.jsa.hazards||[]).length) missing.push('Add at least one JSA hazard');
  if(!pl.jsa.ref) missing.push('Record the JSA reference/document name');
  if(!(pl.aerodromes||[]).length && !pl.ctafNone) missing.push('Add an aerodrome row, or confirm “no aerodromes within range”');
  if(!(pl.notams&&pl.notams.checked)) missing.push('Confirm NOTAMs checked');
  if(!pl.site.lz) missing.push('Primary launch/landing zone');
  if(!pl.site.altLz) missing.push('Alternate landing zone');
  if(!pl.site.publicInterference) missing.push('Public-interference likelihood');
  if(pl.site.tallestObstacleM==null||pl.site.tallestObstacleM==='') missing.push('Tallest obstacle height');
  if(!pl.site.mapsReviewed) missing.push('Confirm aeronautical maps reviewed');
  if(!(os.result)) missing.push('Record OpenSky result');
  if(!(o2.result)) missing.push('Record ok2fly result');
  return { blockers, missing };
}
function approveGateHtml(f){
  const {blockers,missing}=evalPlanning(f);
  const ready = blockers.length===0 && missing.length===0;
  return `<div class="section-title">F · Approval gate</div>
    ${blockers.length? `<div class="section-title" style="color:var(--blocker)">Blockers — must be resolved</div>${blockers.map(b=>`<div class="alert blocker"><span class="ai">🔴</span><div class="abody"><div class="atitle">${b.id} · ${U.esc(b.msg)}</div><div class="awhy">${U.esc(b.why)}</div><div class="afix">➡ ${U.esc(b.fix)}</div></div></div>`).join('')}`:''}
    ${missing.length? `<div class="section-title">Still outstanding</div><ul style="margin:0 0 10px;padding-left:20px;color:var(--ink-2);font-size:.86rem">${missing.map(m=>`<li>${U.esc(m)}</li>`).join('')}</ul>`:''}
    ${ready? `<div class="alert info" style="background:var(--ok-bg);border-color:var(--ok)"><span class="ai">✓</span><div class="abody"><div class="atitle">All planning complete — no open blockers.</div></div></div>
      <div class="card" style="background:var(--panel-2)">${signatureFields('appr', p=>(p.roles||[]).some(r=>/Pilot/i.test(r)))}
      <div class="hint">Approver must be a pilot or the Chief Remote Pilot.</div>
      <button class="btn primary lg" onclick="Flights.approvePlan('${f.id}')">Approve Flight Plan</button></div>`
      : `<button class="btn lg" disabled>Approve Flight Plan — resolve the items above first</button>`}`;
}
function refreshGate(){ const g=$('#approveGate'); if(g && CUR) g.innerHTML = approveGateHtml(CUR); renderNav(); }

/* Planning field handlers */
Flights.setPlan=async(k,v)=>{ CUR.planning[k]=v; await saveFlight(CUR); refreshGate(); };
Flights.setAir=async(app,k,v)=>{ CUR.planning[app]=CUR.planning[app]||{}; CUR.planning[app][k]=v; await saveFlight(CUR,'planning',app+' '+k+'='+v); renderFlightFile(); };
Flights.setAirShot=async(app,input)=>{ const file=input.files&&input.files[0]; if(!file) return; try{ const d=await resizeImage(file,1280,0.72); CUR.planning[app]=CUR.planning[app]||{}; CUR.planning[app].screenshotImg=d; CUR.planning[app].screenshot=true; await saveFlight(CUR,'planning',app+' screenshot attached'); renderFlightFile(); }catch(e){ toast('Could not read image','err'); } };
Flights.clearAirShot=async(app)=>{ if(CUR.planning[app]) CUR.planning[app].screenshotImg=null; await saveFlight(CUR); renderFlightFile(); };
Flights.toggleAir=async(app,k)=>{ CUR.planning[app]=CUR.planning[app]||{}; CUR.planning[app][k]=!CUR.planning[app][k]; await saveFlight(CUR); refreshGate(); const t=event.currentTarget; t.classList.toggle('on'); };
Flights.setApproval=async(app,k,v)=>{ CUR.planning[app].approval=CUR.planning[app].approval||{}; CUR.planning[app].approval[k]=v; await saveFlight(CUR); refreshGate(); };
Flights.toggleScope=async(k)=>{ CUR.planning.scopeFlags[k]=!CUR.planning.scopeFlags[k]; await saveFlight(CUR,'scope',k); renderFlightFile(); };
Flights.toggleWithin3nm=async()=>{ CUR.planning.within3nm=!CUR.planning.within3nm; await saveFlight(CUR); renderFlightFile(); };
Flights.setNotam=async(k,v)=>{ CUR.planning.notams=CUR.planning.notams||{}; CUR.planning.notams[k]=v; await saveFlight(CUR); refreshGate(); };
Flights.toggleNotam=async()=>{ CUR.planning.notams=CUR.planning.notams||{}; CUR.planning.notams.checked=!CUR.planning.notams.checked; await saveFlight(CUR); renderFlightFile(); };
Flights.toggleNotamRestrict=async()=>{ CUR.planning.notams=CUR.planning.notams||{}; CUR.planning.notams.restricts=!CUR.planning.notams.restricts; await saveFlight(CUR); renderFlightFile(); };
Flights.toggleJsa=async()=>{ CUR.planning.jsa.done=!CUR.planning.jsa.done; await saveFlight(CUR); renderFlightFile(); };
Flights.setJsaRef=async(v)=>{ CUR.planning.jsa.ref=v; await saveFlight(CUR); refreshGate(); };
Flights.setSite=async(k,v)=>{ if(k==='tallestObstacleM') v=v===''?null:parseFloat(v); CUR.planning.site[k]=v; await saveFlight(CUR); if(k==='publicInterference') renderFlightFile(); else refreshGate(); };
Flights.toggleMaps=async()=>{ CUR.planning.site.mapsReviewed=!CUR.planning.site.mapsReviewed; await saveFlight(CUR); renderFlightFile(); };
Flights.addAero=async()=>{ CUR.planning.aerodromes.push({name:'',distNm:null,ctaf:'',notes:''}); await saveFlight(CUR); $('#aeroTable').innerHTML=aeroTableHtml(CUR); refreshGate(); };
Flights.setAero=async(i,k,v)=>{ CUR.planning.aerodromes[i][k]= k==='distNm'?(v===''?null:parseFloat(v)):v; await saveFlight(CUR); refreshGate(); };
Flights.delAero=async(i)=>{ CUR.planning.aerodromes.splice(i,1); await saveFlight(CUR); $('#aeroTable').innerHTML=aeroTableHtml(CUR); refreshGate(); };
Flights.toggleCtafNone=async()=>{ CUR.planning.ctafNone = CUR.planning.ctafNone? null : {by:App.currentActor, at:U.nowISO()}; await saveFlight(CUR); renderFlightFile(); };
Flights.addHaz=async()=>{ CUR.planning.jsa.hazards.push({hazard:'',risk:'',control:''}); await saveFlight(CUR); $('#hazTable').innerHTML=hazTableHtml(CUR); refreshGate(); };
Flights.setHaz=async(i,k,v)=>{ CUR.planning.jsa.hazards[i][k]=v; await saveFlight(CUR); if(k==='risk') renderFlightFile(); else refreshGate(); };
Flights.delHaz=async(i)=>{ CUR.planning.jsa.hazards.splice(i,1); await saveFlight(CUR); $('#hazTable').innerHTML=hazTableHtml(CUR); refreshGate(); };

Flights.approvePlan=async(id)=>{
  const f=State.flight(id); const {blockers,missing}=evalPlanning(f);
  if(blockers.length||missing.length){ toast('Resolve outstanding items first','err'); return; }
  const sig=readSignature('appr', p=>(p.roles||[]).some(r=>/Pilot/i.test(r))); if(!sig) return;
  App.currentActor=sig.by;
  f.planApproval=sig; f.status='APPROVED';
  await saveFlight(f,'approve-plan','Flight plan approved by '+sig.by);
  await recompute();
  toast('Flight plan approved — open flight file','ok');
  renderFlightFile();
};

/* Cancel / Amend */
Flights.cancel=async(id)=>{
  const reason=await confirmDialog({title:'Cancel flight file',message:'This flight file will be cancelled. Record why.',confirmLabel:'Cancel flight',danger:true,requireReason:true});
  if(!reason) return;
  const f=State.flight(id); f.cancelled={reason,by:App.currentActor,at:U.nowISO()}; f.status='CANCELLED';
  await saveFlight(f,'cancel','Cancelled: '+reason);
  // clear flight alerts
  for(const a of Alerts.openFor('flight',id)){ if(a.severity!=='blocker'||true){ a.resolvedAt=U.nowISO(); a.resolutionNote='Flight cancelled'; await Store.put('alerts',a); } }
  await recompute(); toast('Flight cancelled'); renderFlightFile();
};
Flights.amend=async(id)=>{
  const text=await confirmDialog({title:'Append amendment',message:'Add a dated correction note. This never alters the original recorded data.',confirmLabel:'Append note',requireReason:true});
  if(!text) return;
  const f=State.flight(id); f.amendments=f.amendments||[]; f.amendments.push({text,by:App.currentActor,at:U.nowISO()});
  await saveEntity('flights','flights',f); // allowed post-completion (append-only)
  await audit('amend','flight',id,text);
  toast('Amendment appended'); CUR=f; renderFlightFile();
};

/* ---- APPROVED stage ---- */
function approvedStage(f){
  const d=State.drone(f.droneId), p=State.person(f.pilotId);
  return `<div class="card">
    <div class="section-title">Open flight file — ready to fly</div>
    <div class="grid cols-2">
      <div class="kv"><span class="k">Location</span><span class="v">${U.esc(f.locationName)}</span></div>
      <div class="kv"><span class="k">Coordinates</span><span class="v mono">${(f.coordinates&&f.coordinates.lat!=null)?f.coordinates.lat.toFixed(5)+', '+f.coordinates.lon.toFixed(5):'Not recorded (historical)'}</span></div>
      <div class="kv"><span class="k">Job #</span><span class="v">${U.esc(f.jobNumber)}</span></div>
      <div class="kv"><span class="k">Planned date</span><span class="v">${U.fmtDate(f.plannedDate)}</span></div>
      <div class="kv"><span class="k">Aircraft</span><span class="v">${d?U.esc(d.nickname+' · '+d.serial):'—'}</span></div>
      <div class="kv"><span class="k">Pilot in command</span><span class="v">${p?U.esc(p.name):'—'}</span></div>
      <div class="kv"><span class="k">Plan approved by</span><span class="v">${f.planApproval?U.esc(f.planApproval.by+' ('+f.planApproval.initials+')'):'—'}</span></div>
      <div class="kv"><span class="k">Approved at</span><span class="v">${f.planApproval?U.fmt(f.planApproval.at):'—'}</span></div>
    </div>
    <div style="margin-top:16px"><button class="btn primary lg" onclick="Flights.startPreflight('${f.id}')">▶ Start Pre-Flight</button></div>
    <p class="hint" style="margin-top:8px">Intended for phone use on site. Starting records the time and who started it.</p>
  </div>
  ${locationBlock(f)}`;
}
Flights.startPreflight=async(id)=>{
  const f=State.flight(id);
  // re-check gate: drone maintenance, pilot recency, stale plan
  const da=droneAssignable(State.drone(f.droneId));
  if(!da.ok){ toast('Pre-flight blocked: '+da.reasons.join('; '),'err'); return; }
  const pa=pilotAssignable(State.person(f.pilotId));
  if(!pa.ok){ toast('Pre-flight blocked: '+pa.reasons.join('; '),'err'); return; }
  const staleDays = U.daysBetween(f.plannedDate, U.nowISO());
  if(staleDays>7 && !f.preOp.reconfirmed){
    const ok=await confirmDialog({title:'Plan is stale',message:`This plan is ${staleDays} days old. Re-verify airspace and NOTAMs (OpenSky, ok2fly, NOTAMs) before proceeding. Tick to confirm you have re-checked all three.`,confirmLabel:'I have re-checked all three'});
    if(!ok) return;
    f.preOp.reconfirmed={by:App.currentActor,at:U.nowISO()};
  }
  f.status='PRE-FLIGHT IN PROGRESS';
  f.preOp.startedAt=U.nowISO(); f.preOp.startedBy=App.currentActor;
  if(!f.sorties.length) f.sorties.push(newSortie(1));
  await saveFlight(f,'start-preflight','Pre-flight started'); await recompute();
  renderFlightFile();
};
function newSortie(n){ return { n, batteryIds:[], preFlightSteps:{}, takeoffAt:null, landedAt:null, durationMin:null, aborted:null, satCount:null, batteryPct:null, postFlight:{steps:{}}, postDone:false }; }
function currentSortie(f){ return f.sorties[f.sorties.length-1]; }

/* ---- PRE-FLIGHT IN PROGRESS: Part 1 (pre-op 14) + Part 2 (pre-flight 8) ---- */
function preflightStage(f){
  const part1Done = f.preOp.done;
  return `${part1Done? preflightPart2(f) : preopPart1(f)}`;
}

/* helper: a flat pre-op checklist item */

function preopPart1(f){
  const d=State.drone(f.droneId);
  const it=n=>f.preOp.items[n]||{};
  const w=f.preOp.weather||{};
  const compatBats = State.batteries.filter(b=>b.status==='In service' && (!b.droneCompat||!b.droneCompat.length||b.droneCompat.includes(f.droneId)));

      <div class="pbody" style="display:block">

    <div class="procstep ${it(7).value&&it(7).value!=='High'?'done':''}">

        ${it(7).value==='High'?`<div class="field"><label class="req">Mitigation note (required to proceed)</label><input value="${U.esc(it(7).note||'')}" onchange="Flights.setOpNote(7,this.value)"></div>
          <div class="alert blocker"><span class="ai">🔴</span><div class="abody"><div class="atitle">High public interference — record a mitigation and reassess to Medium or lower, or cancel the flight.</div></div></div>`:''}

    <div class="procstep ${it(9).ticked?'done':''}">
      <div class="ph" onclick="Flights.toggleOp(9)"><span class="pn">9</span><span class="ptitle">Obstacles confirmed on site; tallest obstacle confirmed</span>${it(9).ticked?`<span class="ts">${U.fmt(it(9).at)}</span>`:''}</div>

      <div class="pbody" style="display:block"><div class="field"><label>Settings note</label><input value="${U.esc(it(12).note||'')}" onchange="Flights.setOpNote(12,this.value)"></div></div></div>
    <div class="procstep">

      ${missing.length?`<div class="section-title">Outstanding</div><ul style="padding-left:20px;color:var(--ink-2);font-size:.86rem">${missing.map(m=>`<li>${U.esc(m)}</li>`).join('')}</ul>`:''}
      ${signatureFields('op14', p=>true)}
      <button class="btn primary lg" ${(blockers.length||missing.length)?'disabled':''} onclick="Flights.completePreop('${f.id}')">Complete Pre-Op Checklist → Pre-Flight Procedure</button>

function weatherBlockerHtml(f){
  const d=State.drone(f.droneId), w=f.preOp.weather||{};
  const alerts=[];
  const limKt = d&&d.windLimit? d.windLimit*1.94384 : null;
  if(limKt!=null){ if((+w.windKt)>limKt||(+w.gustKt)>limKt) alerts.push('B10 · Wind/gusts exceed aircraft limit ('+limKt.toFixed(1)+' kt).'); }
  if(w.precip==='Rain') alerts.push('B10 · Rain — flight must not proceed.');
  if(w.visOk==='N') alerts.push('Visibility not OK.');
  if(!alerts.length) return '';
  return alerts.map(a=>`<div class="alert blocker" style="margin-top:6px"><span class="ai">🔴</span><div class="abody"><div class="atitle">${U.esc(a)}</div></div></div>`).join('');
}
function crewTableHtml(f){
  const rows=f.crew||[];
  const roleOpts=['Pilot in command','Spotter','Camera operator','Other'];
  if(!rows.length) return `<div class="muted" style="font-size:.82rem">No crew assigned yet — add at least two.</div>`;
  return `<div class="rep">${rows.map((r,i)=>`<div class="rep-row">
    <div class="field" style="flex:2"><label>Name</label><select onchange="Flights.setCrew(${i},'personId',this.value)"><option value="">Select…</option>${State.people.filter(p=>p.status==='Active').map(p=>`<option value="${p.id}" ${r.personId===p.id?'selected':''}>${U.esc(p.name)}</option>`).join('')}</select></div>
    <div class="field" style="flex:2"><label>Role</label><select onchange="Flights.setCrew(${i},'role',this.value)">${['',...roleOpts].map(o=>`<option ${r.role===o?'selected':''}>${o}</option>`).join('')}</select></div>
    <button class="rowbtn del" onclick="Flights.delCrew(${i})">Remove</button></div>`).join('')}</div>`;
}
function batChkTableHtml(f){
  const rows=f.preOp.batteries||[];
  if(!rows.length) return `<div class="muted" style="font-size:.82rem">Add the flight battery set from the register.</div>`;
  return `<div class="rep">${rows.map((r,i)=>{ const b=State.battery(r.batteryId); const low=(+r.pct)<90;
    return `<div class="rep-row">
    <div class="field" style="flex:2"><label>Battery</label><input value="${b?U.esc(b.label):r.batteryId}" disabled></div>
    <div class="field"><label>Charge %</label><input type="number" value="${r.pct??''}" onchange="Flights.setBatChk(${i},this.value)" class="${low?'invalid':''}"></div>
    ${low?`<div style="flex:2;color:var(--blocker);font-size:.8rem;align-self:center">🔴 Below 90% — swap or recharge before flight</div>`:'<div style="flex:2"></div>'}
    <button class="rowbtn del" onclick="Flights.delBatChk(${i})">Remove</button></div>`; }).join('')}</div>`;
}
function batteriesOk(f){ const rows=f.preOp.batteries||[]; return rows.length>0 && rows.every(r=>(+r.pct)>=90); }
function evalPreOp(f){
  const blockers=[], missing=[]; const it=n=>f.preOp.items[n]||{};
  if((f.crew||[]).length<2 || (f.crew||[]).some(c=>!c.personId||!c.role)) blockers.push({id:'B9',msg:'Minimum two-person crew required (each with a role)',why:'A minimum two-person crew is required for our operations.'});
  const w=f.preOp.weather||{}, d=State.drone(f.droneId);
  const limKt=d&&d.windLimit?d.windLimit*1.94384:null;
  if(limKt!=null && ((+w.windKt)>limKt||(+w.gustKt)>limKt)) blockers.push({id:'B10',msg:'Wind exceeds aircraft limit',why:'Wind/gusts above the aircraft rating make the flight non-compliant.'});
  if(w.precip==='Rain') blockers.push({id:'B10',msg:'Rain — flight must not proceed',why:'Flying in rain is outside our limits.'});
  if(it(7).value==='High') blockers.push({id:'',msg:'Public interference still High',why:'Reassess to Medium or lower with a recorded mitigation.'});
  if(!batteriesOk(f)) blockers.push({id:'B11',msg:'A flight battery is below 90% (or none listed)',why:'At least one compliant flight battery set (all ≥90%) is required.'});
  [1,2,5,6,8,9,11,12].forEach(n=>{ if(!it(n).ticked) missing.push('Tick item '+n); });
  if(!it(4).ticked) missing.push('Confirm weather within limits (item 4)');
  if(!it(7).value) missing.push('Assess public interference (item 7)');
  return {blockers,missing};
}
/* pre-op handlers */
Flights.toggleOp=async(n)=>{ const it=CUR.preOp.items[n]||{}; it.ticked=!it.ticked; it.at=it.ticked?U.nowISO():null; CUR.preOp.items[n]=it; await saveFlight(CUR); renderFlightFile(); };
Flights.setOpVal=async(n,v)=>{ const it=CUR.preOp.items[n]||{}; it.value=v; it.ticked=(n===7?(v&&v!=='High'):it.ticked); it.at=U.nowISO(); CUR.preOp.items[n]=it; await saveFlight(CUR); renderFlightFile(); };
Flights.setOpNote=async(n,v)=>{ const it=CUR.preOp.items[n]||{}; it.note=v; CUR.preOp.items[n]=it; await saveFlight(CUR); };
Flights.setTallest=async(v)=>{ CUR.preOp.tallestConfirm=v===''?null:parseFloat(v); const it=CUR.preOp.items[9]||{}; it.ticked=true; it.at=U.nowISO(); CUR.preOp.items[9]=it; await saveFlight(CUR); renderFlightFile(); };
Flights.setWeather=async(k,v)=>{ CUR.preOp.weather=CUR.preOp.weather||{}; CUR.preOp.weather[k]=v; await saveFlight(CUR); renderFlightFile(); };
Flights.addCrew=async()=>{ CUR.crew=CUR.crew||[]; CUR.crew.push({personId:'',role:''}); await saveFlight(CUR); renderFlightFile(); };
Flights.setCrew=async(i,k,v)=>{ CUR.crew[i][k]=v; await saveFlight(CUR); renderFlightFile(); };
Flights.delCrew=async(i)=>{ CUR.crew.splice(i,1); await saveFlight(CUR); renderFlightFile(); };
Flights.addBatChk=async()=>{ const sel=$('#addBatSel'); if(!sel||!sel.value){toast('No compatible in-service battery','err');return;} CUR.preOp.batteries=CUR.preOp.batteries||[]; if(CUR.preOp.batteries.some(b=>b.batteryId===sel.value)){toast('Already added','err');return;} CUR.preOp.batteries.push({batteryId:sel.value,pct:null}); await saveFlight(CUR); renderFlightFile(); };
Flights.setBatChk=async(i,v)=>{ CUR.preOp.batteries[i].pct=v===''?null:parseFloat(v); await saveFlight(CUR); renderFlightFile(); };
Flights.delBatChk=async(i)=>{ CUR.preOp.batteries.splice(i,1); await saveFlight(CUR); renderFlightFile(); };
Flights.completePreop=async(id)=>{
  const f=State.flight(id); const {blockers,missing}=evalPreOp(f);
  if(blockers.length||missing.length){ toast('Resolve outstanding pre-op items','err'); return; }
  const sig=readSignature('op14'); if(!sig) return; App.currentActor=sig.by;
  f.preOp.done=true; f.preOp.sig=sig; f.preOp.items[14]={ticked:true,at:U.nowISO()};
  await saveFlight(f,'complete-preop','Pre-op checklist completed by '+sig.by);
  toast('Pre-op complete — begin pre-flight procedure','ok'); renderFlightFile();
};

/* ---- Part 2: Pre-Flight Procedure (8 sequential steps) ---- */
const PREFLIGHT_STEPS = [
  {n:1,label:'Airframe inspection — props secure, no damage',defect:true},
  {n:2,label:'Sensors / gimbal / camera check'},
  {n:3,label:'Battery installed — record Battery ID fitted',battery:true},
  {n:4,label:'Transmitter / controller check — powered, linked, sticks free'},
  {n:5,label:'Self-diagnostic passed & video feed confirmed',defect:true},
  {n:6,label:'Battery %, satellite count, home point confirmed',data:true},
  {n:7,label:'Surroundings clear — crew and public clear of launch area'},
  {n:8,label:'“Taking off” call made + control checks performed',takeoff:true}
];
function preflightPart2(f){
  const s=currentSortie(f);
  const done=n=>s.preFlightSteps[n]&&s.preFlightSteps[n].ticked;
  const firstIncomplete = PREFLIGHT_STEPS.find(st=>!done(st.n));
  const compatBats=State.batteries.filter(b=>b.status==='In service'&&(!b.droneCompat||!b.droneCompat.length||b.droneCompat.includes(f.droneId)));
  return `<div class="card"><div class="section-title">Part 2 · Pre-Flight Procedure — Sortie ${s.n} (complete in order)</div>
    ${PREFLIGHT_STEPS.map(st=>{
      const isDone=done(st.n); const locked=!isDone && firstIncomplete && st.n>firstIncomplete.n;
      const step=s.preFlightSteps[st.n]||{};
      let inner='';
      if(st.battery){ inner=`<div class="field"><label class="req">Battery ID fitted</label><select onchange="Flights.setSortieBattery(this.value)"><option value="">Select…</option>${compatBats.map(b=>`<option value="${b.id}" ${(s.batteryIds||[]).includes(b.id)?'selected':''}>${U.esc(b.label)}</option>`).join('')}</select><div class="hint">Logs a cycle against this battery on takeoff.</div></div>`; }
      if(st.data){ inner=`<div class="inline">
        <div class="field"><label>Battery %</label><input type="number" value="${s.batteryPct??''}" onchange="Flights.setSortieData('batteryPct',this.value)"></div>
        <div class="field"><label>Satellite count</label><input type="number" value="${s.satCount??''}" onchange="Flights.setSortieData('satCount',this.value)"></div></div>
        ${(s.satCount!=null&&s.satCount<8)?`<div class="alert warning"><span class="ai">🟠</span><div class="abody"><div class="atitle">Satellite count below 8 — confirm a reliable GNSS fix before launch.</div></div></div>`:''}`; }
      if(st.defect){ inner+=`<div class="btn-row" style="margin-top:6px"><button class="btn sm danger" onclick="Flights.recordDefect('preflight',${st.n})">Record defect (Grounding)</button></div>`; }
      const tickBtn = st.takeoff
        ? `<button class="btn primary lg" ${locked?'disabled':''} onclick="Flights.takeoff('${f.id}')">✈ Confirm — “Taking off” → FLYING</button>`
        : `<button class="btn ${isDone?'':'primary'}" ${locked?'disabled':''} onclick="Flights.tickPreflight(${st.n})">${isDone?'✓ Ticked':'Tick step '+st.n}</button>`;
      return `<div class="procstep ${isDone?'done open':locked?'locked':'open'}">
        <div class="ph"><span class="pn">${isDone?'✓':st.n}</span><span class="ptitle">${st.label}</span>${isDone?`<span class="ts">${U.fmt(step.at)}</span>`:''}</div>
        <div class="pbody">${inner}<div style="margin-top:8px">${tickBtn}</div></div></div>`;
    }).join('')}
  </div>`;
}
Flights.tickPreflight=async(n)=>{
  const s=currentSortie(CUR); const st=PREFLIGHT_STEPS.find(x=>x.n===n);
  if(st.battery && !(s.batteryIds||[]).length){ toast('Record the Battery ID fitted first','err'); return; }
  s.preFlightSteps[n]={ticked:true,at:U.nowISO()};
  await saveFlight(CUR); renderFlightFile();
};
Flights.setSortieBattery=async(v)=>{ const s=currentSortie(CUR); s.batteryIds=v?[v]:[]; await saveFlight(CUR); };
Flights.setSortieData=async(k,v)=>{ const s=currentSortie(CUR); s[k]=v===''?null:parseFloat(v); await saveFlight(CUR); renderFlightFile(); };
Flights.takeoff=async(id)=>{
  const f=State.flight(id); const s=currentSortie(f);
  for(const st of PREFLIGHT_STEPS){ if(st.n<8 && !(s.preFlightSteps[st.n]&&s.preFlightSteps[st.n].ticked)){ toast('Complete step '+st.n+' first','err'); return; } }
  if(!(s.batteryIds||[]).length){ toast('Battery ID not recorded','err'); return; }
  s.preFlightSteps[8]={ticked:true,at:U.nowISO()}; s.takeoffAt=U.nowISO();
  // log battery cycle
  for(const bid of s.batteryIds){ const b=State.battery(bid); if(b){ b.cycles=(b.cycles||0)+1; await saveEntity('batteries','batteries',b); } }
  f.status='FLYING';
  await saveFlight(f,'takeoff','Sortie '+s.n+' takeoff'); await recompute();
  toast('Airborne — sortie '+s.n,'ok'); renderFlightFile();
};

/* ---- Defect → Maintenance Issue ---- */
Flights.recordDefect=async(phase,step)=>{
  const f=CUR; const d=State.drone(f.droneId);
  const grounding = phase==='preflight';
  const body=`<p>Recording a defect on <b>${U.esc(d.nickname)}</b> (${phase} step ${step}).</p>
    <div class="field"><label class="req">Defect description</label><textarea id="dfDesc"></textarea></div>
    <div class="field"><label class="req">Severity</label><select id="dfSev">
      <option value="Grounding" ${grounding?'selected':''}>Grounding — aircraft unavailable</option>
      <option value="Monitor">Monitor — review before next assignment</option></select></div>`;
  Modal.open({title:'Record defect → Maintenance Issue',body,
    footer:`<button class="btn ghost" onclick="Modal.closeAll()">Cancel</button><button class="btn danger" onclick="Flights.saveDefect('${phase}',${step})">Log defect</button>`});
};
Flights.saveDefect=async(phase,step)=>{
  const desc=$('#dfDesc').value.trim(); const sev=$('#dfSev').value;
  if(!desc){ toast('Describe the defect','err'); return; }
  const f=CUR; const issue={ id:await U.seqId('MNT-ISS'), droneId:f.droneId, flightId:f.id, description:desc, severity:sev,
    raisedBy:App.currentActor, raisedAt:U.nowISO(), status:'Open', rectification:null, createdAt:U.nowISO(), updatedAt:U.nowISO() };
  await saveEntity('maintIssues','maintIssues',issue);
  await audit('defect','drone',f.droneId,sev+': '+desc);
  const d=State.drone(f.droneId);
  if(sev==='Grounding'){ d.status='In maintenance'; await saveEntity('drones','drones',d);
    await Alerts.raise({severity:'blocker',message:`${d.nickname}: grounding defect — ${desc.slice(0,60)}`,why:'Grounding defect: aircraft is unavailable until rectified and signed off (B6/B13).',fix:'Rectify in Fleet ▸ Maintenance and have the Maintenance Controller sign off.',entityType:'drone',entityId:d.id,ruleKey:'issue:'+issue.id});
  } else {
    await Alerts.raise({severity:'warning',message:`${d.nickname}: monitor-level defect — ${desc.slice(0,60)}`,why:'Open monitor-level defect on this aircraft — review before flight.',fix:'Rectify or acknowledge in Fleet ▸ Maintenance.',entityType:'drone',entityId:d.id,ruleKey:'issue:'+issue.id});
  }
  Modal.closeAll(); await recompute();
  toast('Defect logged as '+issue.id, sev==='Grounding'?'err':'');
  renderFlightFile();
};

/* ---- FLYING stage (minimal, big targets) ---- */
function flyingStage(f){
  const s=currentSortie(f);
  return `<div class="card" style="text-align:center">
    <div class="section-title">Sortie ${s.n} · airborne</div>
    <div style="font-size:2.4rem;margin:10px 0">🛸</div>
    <div class="muted">Takeoff: ${U.fmt(s.takeoffAt)}</div>
    <div class="field" style="max-width:420px;margin:16px auto 0"><label>Quick note (spotter)</label><input id="flyNote" value="${U.esc(s.spotterNote||'')}" onchange="Flights.setSortieNote(this.value)"></div>
    <div style="max-width:420px;margin:16px auto 0;display:grid;gap:10px">
      <button class="btn primary lg" onclick="Flights.land('${f.id}')">🛬 Aircraft Landed</button>
      <button class="btn danger lg" onclick="Flights.abort('${f.id}')">⛔ ABORT</button>
    </div>
  </div>`;
}
Flights.setSortieNote=async(v)=>{ currentSortie(CUR).spotterNote=v; await saveFlight(CUR); };
Flights.land=async(id)=>{
  const f=State.flight(id); const s=currentSortie(f);
  s.landedAt=U.nowISO(); s.durationMin=Math.max(1,Math.round((new Date(s.landedAt)-new Date(s.takeoffAt))/60000));
  f.status='POST-FLIGHT IN PROGRESS'; f.postFlight.steps[1]={ticked:true,at:U.nowISO()};
  await saveFlight(f,'land','Sortie '+s.n+' landed ('+s.durationMin+' min)'); await recompute();
  toast('Landed — '+s.durationMin+' min','ok'); renderFlightFile();
};
Flights.abort=async(id)=>{
  const reason=await confirmDialog({title:'Abort flight',message:'Record why the flight is being aborted. A post-flight inspection is still required before the file can close.',confirmLabel:'Abort',danger:true,requireReason:true});
  if(!reason) return;
  const f=State.flight(id); const s=currentSortie(f);
  s.aborted={reason,by:App.currentActor,at:U.nowISO()};
  if(s.takeoffAt && !s.landedAt){ s.landedAt=U.nowISO(); s.durationMin=Math.max(0,Math.round((new Date(s.landedAt)-new Date(s.takeoffAt))/60000)); }
  f.abort={reason,by:App.currentActor,at:U.nowISO()};
  f.status='POST-FLIGHT IN PROGRESS'; f.postFlight.steps[1]={ticked:true,at:U.nowISO()};
  await saveFlight(f,'abort','Aborted: '+reason); await recompute();
  toast('Flight aborted — complete post-flight inspection','err'); renderFlightFile();
};

/* ---- POST-FLIGHT PROCEDURE (9 steps) ---- */
const POSTFLIGHT_STEPS=[
  {n:1,label:'Aircraft landed and disarmed'},
  {n:2,label:'“Aircraft Safe” call made'},
  {n:3,label:'Airframe inspection — damage / stress',defect:true},
  {n:4,label:'Motor / ESC heat check',defect:true},
  {n:5,label:'Propeller inspection',defect:true},
  {n:6,label:'Connectors and cables inspection',defect:true},
  {n:7,label:'Camera / gimbal / lens inspection',defect:true},
  {n:8,label:'Controller / transmitter inspection & power-down'},
  {n:9,label:'Flight time recorded',time:true}
];
function postflightStage(f){
  const done=n=>f.postFlight.steps[n]&&f.postFlight.steps[n].ticked;
  const firstIncomplete=POSTFLIGHT_STEPS.find(st=>!done(st.n));
  const totalMin=f.sorties.reduce((s,x)=>s+(x.durationMin||0),0);
  const canFlyAgain = !f.abort && !done(9);
  return `<div class="card"><div class="section-title">Post-Flight Procedure (complete in order)</div>
    ${f.abort?`<div class="alert warning"><span class="ai">🟠</span><div class="abody"><div class="atitle">Flight was aborted.</div><div class="awhy">${U.esc(f.abort.reason)}</div></div></div>`:''}
    ${POSTFLIGHT_STEPS.map(st=>{
      const isDone=done(st.n); const locked=!isDone&&firstIncomplete&&st.n>firstIncomplete.n;
      const step=f.postFlight.steps[st.n]||{};
      let inner='';
      if(st.defect) inner=`<div class="btn-row"><button class="btn sm" onclick="Flights.recordDefect('postflight',${st.n})">Record defect</button></div>`;
      if(st.time){ inner=`<div class="field"><label>Total flight time this operation (min)</label><input type="number" value="${f.postFlight.confirmedMin??totalMin}" onchange="Flights.setConfirmedMin(this.value)"></div>
        <div class="hint">Auto-computed from sortie times: ${totalMin} min across ${f.sorties.length} sortie(s). Adjusting requires a reason.</div>`; }
      const tickBtn = st.time
        ? `<button class="btn primary lg" ${locked?'disabled':''} onclick="Flights.confirmFlightTime('${f.id}')">Confirm flight time → add to totals</button>`
        : `<button class="btn ${isDone?'':'primary'}" ${locked?'disabled':''} onclick="Flights.tickPostflight(${st.n})">${isDone?'✓ Ticked':'Tick step '+st.n}</button>`;
      return `<div class="procstep ${isDone?'done open':locked?'locked':'open'}">
        <div class="ph"><span class="pn">${isDone?'✓':st.n}</span><span class="ptitle">${st.label}</span>${isDone?`<span class="ts">${U.fmt(step.at)}</span>`:''}</div>
        <div class="pbody">${inner}<div style="margin-top:8px">${tickBtn}</div></div></div>`;
    }).join('')}
    ${canFlyAgain?`<div class="divider"></div><button class="btn" onclick="Flights.flyAgain('${f.id}')">🔁 Fly again under this file (new sortie)</button>
      <p class="hint">Loops back to the Pre-Flight Procedure for a new sortie (e.g. battery swap / another take).</p>`:''}
  </div>
  ${f.postFlight.done? postOpChecklist(f) : ''}`;
}
Flights.tickPostflight=async(n)=>{ CUR.postFlight.steps[n]={ticked:true,at:U.nowISO()}; await saveFlight(CUR); renderFlightFile(); };

/* ---- POST-OPERATION CHECKLIST (10 items) + submission ---- */
function postOpChecklist(f){
  const d=State.drone(f.droneId);
  const it=n=>f.postOp.items[n]||{};
  const po=f.postOp;
  const spotterNames=(f.crew||[]).filter(c=>/Spotter/i.test(c.role)).map(c=>{const p=State.person(c.personId);return p?p.name:'';}).filter(Boolean);
  const usedBats=[...new Set(f.sorties.flatMap(s=>s.batteryIds||[]))];
  const totalMin=f.postFlight.totalMin||0;
  const autoIssues=State.maintIssues.filter(i=>i.flightId===f.id);
  const missingLanding=f.sorties.some(s=>s.takeoffAt&&!s.landedAt);
  const {ok,missing}=evalPostOp(f);
  return `<div class="card"><div class="section-title">Post-Operation Pilot Checklist (10 items)</div>
    ${opItemTick(1,f,`Drone flown confirmed — <b>${d?U.esc(d.model):'—'}</b>`)}
    <div class="procstep ${!missingLanding?'done':''}"><div class="ph"><span class="pn">2</span><span class="ptitle">All sorties logged and complete</span></div>
      <div class="pbody" style="display:block">${missingLanding?`<div class="alert blocker"><span class="ai">🔴</span><div class="abody"><div class="atitle">B14 · A sortie is missing a landing time.</div></div></div>`:`<div class="muted" style="font-size:.85rem">${f.sorties.length} sortie(s), all with landing times. ✓</div>`}</div></div>
    <div class="procstep ${it(3).ticked?'done':''}"><div class="ph" onclick="Flights.toggleOpPost(3)"><span class="pn">3</span><span class="ptitle">Spotters used — names confirmed</span></div>
      <div class="pbody" style="display:block"><div class="muted" style="font-size:.85rem;margin-bottom:6px">${spotterNames.length?U.esc(spotterNames.join(', ')):'No spotter role assigned in crew.'}</div>
        <label class="tick ${it(3).ticked?'on':''}" onclick="event.stopPropagation();Flights.toggleOpPost(3)"><span class="box">✓</span><span class="txt">Confirmed</span></label></div></div>
    <div class="procstep done"><div class="ph"><span class="pn">4</span><span class="ptitle">Total flight hours this operation</span></div>
      <div class="pbody" style="display:block"><div class="muted">${totalMin} min (${(totalMin/60).toFixed(2)} h) — auto-summed.</div></div></div>
    <div class="procstep ${batPostOk(f)?'done':''}"><div class="ph"><span class="pn">5</span><span class="ptitle">Battery post-flight state</span></div>
      <div class="pbody" style="display:block">${usedBats.length?`<div class="rep">${usedBats.map(bid=>{const b=State.battery(bid);const st=(po.batPost&&po.batPost[bid])||{};
        return `<div class="rep-row"><div class="field" style="flex:2"><label>Battery</label><input value="${b?U.esc(b.label):bid}" disabled></div>
          <div class="field"><label>Charge remaining %</label><input type="number" value="${st.pct??''}" onchange="Flights.setBatPost('${bid}','pct',this.value)"></div>
          <div class="field"><label>Condition OK</label><select onchange="Flights.setBatPost('${bid}','ok',this.value)">${['','Y','N'].map(o=>`<option ${st.ok===o?'selected':''}>${o}</option>`).join('')}</select></div></div>`;}).join('')}</div>`:'<div class="muted" style="font-size:.85rem">No batteries recorded against sorties.</div>'}</div></div>
    ${opItemTick(6,f,'Media offloaded and backed up')}
    <div class="procstep ${it(7).value?'done':''}"><div class="ph"><span class="pn">7</span><span class="ptitle">Maintenance issues arising?</span></div>
      <div class="pbody" style="display:block"><div class="field"><select onchange="Flights.setOpPostVal(7,this.value)">${['','No','Yes'].map(o=>`<option ${it(7).value===o?'selected':''}>${o}</option>`).join('')}</select></div>
        ${it(7).value==='Yes'?`<div class="muted" style="font-size:.85rem">Linked issues: ${autoIssues.length?autoIssues.map(i=>i.id).join(', '):'<span style="color:var(--blocker)">none linked — record at least one</span>'}</div>`:''}</div></div>
    <div class="procstep ${it(8).value?'done':''}"><div class="ph"><span class="pn">8</span><span class="ptitle">Incidents / occurrences?</span></div>
      <div class="pbody" style="display:block"><div class="field"><select onchange="Flights.setOccurrence(this.value)">${['','No','Yes'].map(o=>`<option ${it(8).value===o?'selected':''}>${o}</option>`).join('')}</select></div>
        ${it(8).value==='Yes'?occurrenceHtml(f):''}</div></div>
    <div class="procstep"><div class="ph"><span class="pn">9</span><span class="ptitle">Notes / lessons</span></div>
      <div class="pbody" style="display:block"><textarea onchange="Flights.setOpPostNote(9,this.value)">${U.esc(it(9).note||'')}</textarea></div></div>
    <div class="divider"></div>
    <div class="card" style="background:var(--panel-2)"><div class="section-title">10 · Completed by &amp; submit</div>
      ${Alerts.blockersFor('flight',f.id).length?`<div class="alert blocker"><span class="ai">🔴</span><div class="abody"><div class="atitle">B16 · Open blockers on this file must be resolved before submitting.</div></div></div>`:''}
      ${missing.length?`<div class="section-title">Outstanding</div><ul style="padding-left:20px;color:var(--ink-2);font-size:.86rem">${missing.map(m=>`<li>${U.esc(m)}</li>`).join('')}</ul>`:''}
      ${signatureFields('po10', p=>true)}
      <button class="btn primary lg" ${(!ok||Alerts.blockersFor('flight',f.id).length)?'disabled':''} onclick="Flights.submit('${f.id}')">Submit for Approval</button>
    </div>
  </div>`;
}
function occurrenceHtml(f){
  const oc=f.postOp.occurrence||{};
  const atsb=oc.atsb||{};
  return `<div class="field"><label class="req">Severity</label><select onchange="Flights.setOccSeverity(this.value)">
      ${['','Minor','Serious incident or accident'].map(o=>`<option ${oc.severity===o?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field"><label>Details</label><textarea onchange="Flights.setOccDetails(this.value)">${U.esc(oc.details||'')}</textarea></div>
    ${oc.severity==='Serious incident or accident'?`<div class="alert blocker"><span class="ai">🔴</span><div class="abody">
      <div class="atitle">ATSB immediately-reportable occurrence</div>
      <div class="awhy">Notify the ATSB as soon as possible and submit a written report within 72 hours. This file cannot be completed until the ATSB record is filled (B15).</div></div></div>
      <div class="inline"><div class="field"><label class="req">ATSB notified at</label><input type="datetime-local" value="${atsb.notifiedAtLocal||''}" onchange="Flights.setAtsb('notifiedAtLocal',this.value)"></div>
        <div class="field"><label class="req">Reference #</label><input value="${U.esc(atsb.ref||'')}" onchange="Flights.setAtsb('ref',this.value)"></div></div>
      <div class="field"><label class="req">Notified by</label><input value="${U.esc(atsb.by||'')}" onchange="Flights.setAtsb('by',this.value)"></div>`:''}`;
}
function evalPostOp(f){
  const missing=[]; const it=n=>f.postOp.items[n]||{};
  if(f.sorties.some(s=>s.takeoffAt&&!s.landedAt)) missing.push('All sorties must have a landing time (item 2)');
  [1,6].forEach(n=>{ if(!it(n).ticked) missing.push('Tick item '+n); });
  if(!it(3).ticked) missing.push('Confirm spotters (item 3)');
  if(!it(7).value) missing.push('Answer maintenance issues arising (item 7)');
  if(it(7).value==='Yes' && !State.maintIssues.some(i=>i.flightId===f.id)) missing.push('Link at least one maintenance issue (item 7)');
  if(!it(8).value) missing.push('Answer incidents/occurrences (item 8)');
  const oc=f.postOp.occurrence;
  if(it(8).value==='Yes'){ if(!oc||!oc.severity) missing.push('Record occurrence severity (item 8)');
    if(oc&&oc.severity==='Serious incident or accident'){ const a=oc.atsb||{}; if(!a.notifiedAtLocal||!a.ref||!a.by) missing.push('Complete the ATSB record (B15)'); } }
  const usedBats=[...new Set(f.sorties.flatMap(s=>s.batteryIds||[]))];
  if(usedBats.some(bid=>{const st=(f.postOp.batPost&&f.postOp.batPost[bid])||{};return !st.ok;})) missing.push('Record post-flight state for each used battery (item 5)');
  return {ok:missing.length===0, missing};
}
function batPostOk(f){ const usedBats=[...new Set(f.sorties.flatMap(s=>s.batteryIds||[]))]; return usedBats.length===0||usedBats.every(bid=>{const st=(f.postOp.batPost&&f.postOp.batPost[bid])||{};return st.ok;}); }
/* post-op handlers */
Flights.toggleOpPost=async(n)=>{ const it=CUR.postOp.items[n]||{}; it.ticked=!it.ticked; it.at=it.ticked?U.nowISO():null; CUR.postOp.items[n]=it; await saveFlight(CUR); renderFlightFile(); };
Flights.setOpPostVal=async(n,v)=>{ const it=CUR.postOp.items[n]||{}; it.value=v; CUR.postOp.items[n]=it; await saveFlight(CUR); renderFlightFile(); };
Flights.setOpPostNote=async(n,v)=>{ const it=CUR.postOp.items[n]||{}; it.note=v; CUR.postOp.items[n]=it; await saveFlight(CUR); };
Flights.setBatPost=async(bid,k,v)=>{ CUR.postOp.batPost=CUR.postOp.batPost||{}; CUR.postOp.batPost[bid]=CUR.postOp.batPost[bid]||{}; CUR.postOp.batPost[bid][k]=v;
  if(k==='ok'&&v==='N'){ const b=State.battery(bid); if(b){ b.conditionNotes=b.conditionNotes||[]; b.conditionNotes.push({note:'Flagged post-flight on '+CUR.id,at:U.nowISO()});
    await Alerts.raise({severity:'warning',message:`Battery ${b.label} flagged post-flight`,why:'Battery condition marked not-OK — inspect before reuse.',fix:'Inspect/quarantine in Fleet ▸ Batteries.',entityType:'battery',entityId:b.id,ruleKey:'batpost:'+b.id}); await saveEntity('batteries','batteries',b);} }
  await saveFlight(CUR); renderFlightFile(); };
Flights.setOccurrence=async(v)=>{ const it=CUR.postOp.items[8]||{}; it.value=v; CUR.postOp.items[8]=it; if(v==='Yes'){CUR.postOp.occurrence=CUR.postOp.occurrence||{};} else CUR.postOp.occurrence=null; await saveFlight(CUR); renderFlightFile(); };
Flights.setOccSeverity=async(v)=>{ CUR.postOp.occurrence=CUR.postOp.occurrence||{}; CUR.postOp.occurrence.severity=v;
  if(v==='Serious incident or accident'){ await Alerts.raise({severity:'blocker',message:`ATSB reportable occurrence on ${CUR.id}`,why:'A serious incident/accident is immediately reportable to the ATSB; a written report is due within 72 hours (B15).',fix:'Notify ATSB and record notification time, reference and who notified.',entityType:'flight',entityId:CUR.id,ruleKey:'atsb:'+CUR.id}); }
  else await Alerts.resolve('atsb:'+CUR.id);
  await saveFlight(CUR); await recompute(); renderFlightFile(); };
Flights.setOccDetails=async(v)=>{ CUR.postOp.occurrence=CUR.postOp.occurrence||{}; CUR.postOp.occurrence.details=v; await saveFlight(CUR); };
Flights.setAtsb=async(k,v)=>{ CUR.postOp.occurrence.atsb=CUR.postOp.occurrence.atsb||{}; CUR.postOp.occurrence.atsb[k]=v;
  const a=CUR.postOp.occurrence.atsb;
  if(a.notifiedAtLocal&&a.ref&&a.by){
    await Alerts.resolve('atsb:'+CUR.id);
    if(!CUR.postOp.occurrence._opsManualLogged){
      CUR.postOp.occurrence._opsManualLogged=true;
      await logOpsManualEntry('Incidents & Occurrences', 'ATSB-reportable occurrence — '+CUR.id, (CUR.postOp.occurrence.details||'')+' · ATSB ref '+a.ref+' · Notified by '+a.by+' at '+a.notifiedAtLocal, CUR.id);
    }
  }
  await saveFlight(CUR); await recompute(); renderFlightFile(); };
Flights.submit=async(id)=>{
  const f=State.flight(id); const {ok,missing}=evalPostOp(f);
  if(!ok){ toast('Outstanding: '+missing[0],'err'); return; }
  if(Alerts.blockersFor('flight',id).length){ toast('Resolve open blockers first (B16)','err'); return; }
  const sig=readSignature('po10'); if(!sig) return; App.currentActor=sig.by;
  f.postOp.items[10]={ticked:true,at:U.nowISO()}; f.postOp.sig=sig;
  f.submission={by:sig.by,initials:sig.initials,at:U.nowISO()}; f.status='SUBMITTED FOR APPROVAL';
  await saveFlight(f,'submit','Submitted for approval by '+sig.by); await recompute();
  toast('Submitted for approval','ok'); renderFlightFile();
};

/* ---- SUBMITTED: approve & file ---- */
function submittedStage(f){
  return `${flightSummaryReadonly(f)}${locationBlock(f)}${airspaceImagesBlock(f)}
    <div class="card" style="background:var(--panel-2)"><div class="section-title">Approve &amp; File (Chief Remote Pilot or designated approver)</div>
      <p class="muted" style="font-size:.86rem">Review the read-only summary above. On approval the file becomes immutable and is archived as the definitive audit record.</p>
      ${Alerts.blockersFor('flight',f.id).length?`<div class="alert blocker"><span class="ai">🔴</span><div class="abody"><div class="atitle">Open blockers must be resolved before filing (B16).</div></div></div>`:''}
      ${signatureFields('close', p=>(p.roles||[]).some(r=>/Pilot/i.test(r)))}
      <button class="btn primary lg" ${Alerts.blockersFor('flight',f.id).length?'disabled':''} onclick="Flights.close('${f.id}')">✓ Approve &amp; File → COMPLETED</button>
    </div>`;
}
Flights.close=async(id)=>{
  const f=State.flight(id);
  if(Alerts.blockersFor('flight',id).length){ toast('Resolve open blockers first','err'); return; }
  const sig=readSignature('close', p=>(p.roles||[]).some(r=>/Pilot/i.test(r))); if(!sig) return; App.currentActor=sig.by;
  f.closure={by:sig.by,initials:sig.initials,at:U.nowISO()}; f.status='COMPLETED';
  await saveEntity('flights','flights',f);
  await audit('close','flight',id,'Approved & filed by '+sig.by);
  // resolve remaining non-blocker flight alerts
  for(const a of Alerts.openFor('flight',id)){ a.resolvedAt=U.nowISO(); a.resolutionNote='Flight filed'; await Store.put('alerts',a); }
  await recompute();
  toast('Flight '+id+' filed — read-only','ok'); CUR=f; renderFlightFile();
};

function completedStage(f){ return flightSummaryReadonly(f) + locationBlock(f) + airspaceImagesBlock(f) + `<div class="card no-print"><div class="section-title">Amendments</div>${amendmentsHtml(f)}</div>`; }
function closedStage(f){
  const reason=f.cancelled?f.cancelled.reason:(f.abort?f.abort.reason:'');
  return `<div class="card"><div class="alert ${f.status==='CANCELLED'?'blocker':'warning'}"><span class="ai">${f.status==='CANCELLED'?'⛔':'🟠'}</span><div class="abody"><div class="atitle">Flight ${f.status}</div><div class="awhy">${U.esc(reason||'')}</div></div></div></div>`
    + (f.sorties.length?flightSummaryReadonly(f):'');
}
function amendmentsHtml(f){
  if(!f.amendments||!f.amendments.length) return '<div class="muted" style="font-size:.85rem">No amendments. Use “Amend” to append dated correction notes without altering original data.</div>';
  return f.amendments.map(a=>`<div class="kv"><span class="k">${U.fmt(a.at)} · ${U.esc(a.by)}</span><span class="v" style="text-align:left;font-weight:400">${U.esc(a.text)}</span></div>`).join('');
}

/* Location card: Google Maps link + attached screenshot */
function locationBlock(f){
  const hasCoord = f.coordinates && f.coordinates.lat!=null;
  if(!hasCoord && !f.locationImage) return '';
  return `<div class="card"><div class="section-title">Location</div>
    ${hasCoord?`<div class="kv"><span class="k">Coordinates</span><span class="v mono">${f.coordinates.lat.toFixed(5)}, ${f.coordinates.lon.toFixed(5)}</span></div>
      <div class="btn-row no-print" style="margin:8px 0"><a class="btn sm" href="https://www.google.com/maps?q=${f.coordinates.lat},${f.coordinates.lon}" target="_blank" rel="noopener">🗺 Open in Google Maps</a></div>`:''}
    ${f.locationImage?`<img src="${f.locationImage}" alt="Location screenshot" style="max-width:100%;border-radius:8px;border:1px solid var(--line)">`:'<div class="muted no-print" style="font-size:.82rem">No location screenshot attached.</div>'}
  </div>`;
}

/* Airspace-check screenshots (OpenSky / ok2fly) for the record */
function airspaceImagesBlock(f){
  const os=(f.planning&&f.planning.openSky&&f.planning.openSky.screenshotImg), o2=(f.planning&&f.planning.ok2fly&&f.planning.ok2fly.screenshotImg);
  if(!os && !o2) return '';
  return `<div class="card"><div class="section-title">Airspace check screenshots</div>
    ${os?`<div style="margin-bottom:10px"><div class="hint">OpenSky</div><img src="${os}" alt="OpenSky screenshot" style="max-width:100%;border-radius:8px;border:1px solid var(--line)"></div>`:''}
    ${o2?`<div><div class="hint">ok2fly</div><img src="${o2}" alt="ok2fly screenshot" style="max-width:100%;border-radius:8px;border:1px solid var(--line)"></div>`:''}
  </div>`;
}

/* ---- Read-only whole-file summary (screen) ---- */
function flightSummaryReadonly(f){
  const d=State.drone(f.droneId), p=State.person(f.pilotId), pl=f.planning;
  const totalMin=f.postFlight.totalMin || f.sorties.reduce((s,x)=>s+(x.durationMin||0),0);
  const crewRows=(f.crew||[]).map(c=>{const cp=State.person(c.personId);return `<tr><td>${cp?U.esc(cp.name):'—'}</td><td>${U.esc(c.role||'')}</td></tr>`;}).join('');
  return `<div class="card"><div class="section-title">Summary</div>
    <div class="grid cols-2">
      <div class="kv"><span class="k">Date</span><span class="v">${U.fmtDate(f.plannedDate)}</span></div>
      <div class="kv"><span class="k">Location</span><span class="v">${U.esc(f.locationName)}</span></div>

function printFlight(id){
  const f=State.flight(id); const s=State.settings;
  const d=State.drone(f.droneId), p=State.person(f.pilotId), pl=f.planning;
  const yn=v=>v?'Yes':'No';

  const it=n=>f.preOp.items[n]||{}; const pit=n=>f.postOp.items[n]||{};
  const totalMin=f.postFlight.totalMin||f.sorties.reduce((a,x)=>a+(x.durationMin||0),0);
  const flightAlerts=State.alerts.filter(a=>a.entityType==='flight'&&a.entityId===f.id);
  const w=f.preOp.weather||{};
  const doc=`<div class="print-doc">
    <div class="print-head">
      <div class="org">${U.esc(s.orgName)}</div>
      <div class="meta">ReOC ${U.esc(s.reocNumber||'—')} · Flight Operation Record · <b>${f.id}</b> · Status ${U.esc(f.status)}</div>
    </div>
    <div class="print-sec"><h3>Summary</h3>
      <table><tr><td><b>Date</b></td><td>${U.fmtDate(f.plannedDate)}</td><td><b>Job #</b></td><td>${U.esc(f.jobNumber)}</td></tr>
      <tr><td><b>Location</b></td><td>${U.esc(f.locationName)}</td><td><b>Coordinates</b></td><td>${(f.coordinates&&f.coordinates.lat!=null)?f.coordinates.lat.toFixed(5)+', '+f.coordinates.lon.toFixed(5):'Not recorded (historical)'}</td></tr>
      <tr><td><b>Aircraft</b></td><td>${d?U.esc(d.make+' '+d.model):'—'}</td><td><b>Serial</b></td><td>${d?U.esc(d.serial):'—'}</td></tr>
      <tr><td><b>Pilot in command</b></td><td>${p?U.esc(p.name):'—'}</td><td><b>Total flight time</b></td><td>${totalMin} min · ${f.sorties.length} sortie(s)</td></tr></table>
      <table><tr><th>Crew</th><th>Role</th></tr>${(f.crew||[]).map(c=>{const cp=State.person(c.personId);return `<tr><td>${cp?U.esc(cp.name):'—'}</td><td>${U.esc(c.role||'')}</td></tr>`;}).join('')}</table>
      ${f.locationImage?`<div style="margin-top:6px"><b>Location screenshot:</b><br><img src="${f.locationImage}" style="max-width:100%;max-height:320px;border:1px solid #999;margin-top:4px"></div>`:''}
    </div>
    <div class="print-sec"><h3>Airspace &amp; planning</h3>
      <table><tr><th>Check</th><th>Result</th><th>Notes</th></tr>
        <tr><td>OpenSky</td><td>${U.esc(pl.openSky.result||'—')}</td><td>${U.esc(pl.openSky.notes||'')}</td></tr>
        <tr><td>ok2fly</td><td>${U.esc(pl.ok2fly.result||'—')}</td><td>${U.esc(pl.ok2fly.notes||'')}</td></tr></table>
      ${pl.openSky.screenshotImg?`<div style="margin:4px 0"><b>OpenSky screenshot:</b><br><img src="${pl.openSky.screenshotImg}" style="max-width:100%;max-height:300px;border:1px solid #999;margin-top:4px"></div>`:''}
      ${pl.ok2fly.screenshotImg?`<div style="margin:4px 0"><b>ok2fly screenshot:</b><br><img src="${pl.ok2fly.screenshotImg}" style="max-width:100%;max-height:300px;border:1px solid #999;margin-top:4px"></div>`:''}
      <table><tr><th>Aerodrome</th><th>Dist (NM)</th><th>CTAF</th><th>Notes</th></tr>
        ${(pl.aerodromes||[]).map(a=>`<tr><td>${U.esc(a.name||'')}</td><td>${a.distNm??''}</td><td>${U.esc(a.ctaf||'')}</td><td>${U.esc(a.notes||'')}</td></tr>`).join('')||'<tr><td colspan=4>'+(pl.ctafNone?'No aerodromes within range (verified in both apps)':'—')+'</td></tr>'}</table>
      <div>NOTAMs checked: ${yn(pl.notams&&pl.notams.checked)} — ${U.esc((pl.notams&&pl.notams.notes)||'')}</div>
      <table><tr><th>JSA Hazard</th><th>Residual risk</th><th>Control</th></tr>
        ${(pl.jsa.hazards||[]).map(hz=>`<tr><td>${U.esc(hz.hazard||'')}</td><td>${U.esc(hz.risk||'')}</td><td>${U.esc(hz.control||'')}</td></tr>`).join('')}</table>
      <div>Launch/landing: ${U.esc(pl.site.lz||'')} · Alternate: ${U.esc(pl.site.altLz||'')} · Tallest obstacle: ${pl.site.tallestObstacleM??'—'} m</div>
      <div><b>Plan approved:</b> ${f.planApproval?U.esc(f.planApproval.by+' ('+f.planApproval.initials+') — '+U.fmt(f.planApproval.at)):'—'}</div>

      ${tickList([

        {on:it(2).ticked,label:'2 JSA read & understood',at:it(2).at},
        {on:(f.crew||[]).length>=2,label:'3 Crew roles assigned',val:(f.crew||[]).length+' crew'},
        {on:it(4).ticked,label:'4 Weather within limits',val:`wind ${w.windKt??'—'}kt, gust ${w.gustKt??'—'}kt, ${w.precip||'—'}, temp ${w.temp??'—'}°C`,at:it(4).at},
        {on:it(5).ticked,label:'5 Crew huddle / briefing',at:it(5).at},
        {on:it(6).ticked,label:'6 Alternate LZ confirmed on site',at:it(6).at},
        {on:it(7).value&&it(7).value!=='High',label:'7 Public interference re-assessed',val:it(7).value,note:it(7).note},
        {on:it(8).ticked,label:'8 Aeronautical maps reviewed',at:it(8).at},
        {on:it(9).ticked,label:'9 Obstacles confirmed',val:(f.preOp.tallestConfirm??pl.site.tallestObstacleM)+' m',at:it(9).at},
        {on:batteriesOk(f),label:'10 Batteries >90%',val:(f.preOp.batteries||[]).map(b=>{const bb=State.battery(b.batteryId);return (bb?bb.label:b.batteryId)+' '+b.pct+'%';}).join(', ')},
        {on:it(11).ticked,label:'11 Media storage OK',at:it(11).at},
        {on:it(12).ticked,label:'12 Camera settings configured',note:it(12).note,at:it(12).at},
        {on:!!it(13).note,label:'13 Field notes',note:it(13).note}
      ])}
      <div><b>Completed by:</b> ${f.preOp.sig?U.esc(f.preOp.sig.by+' ('+f.preOp.sig.initials+') — '+U.fmt(f.preOp.sig.at)):'—'}</div>
    </div>
    ${f.sorties.map(sr=>`<div class="print-sec"><h3>Sortie ${sr.n}</h3>
      ${tickList(PREFLIGHT_STEPS.map(st=>({on:sr.preFlightSteps[st.n]&&sr.preFlightSteps[st.n].ticked,label:st.n+' '+st.label,at:sr.preFlightSteps[st.n]&&sr.preFlightSteps[st.n].at})))}
      <div>Battery fitted: ${(sr.batteryIds||[]).map(b=>{const bb=State.battery(b);return bb?bb.label:b;}).join(', ')||'—'} · Takeoff: ${U.fmt(sr.takeoffAt)} · Landed: ${U.fmt(sr.landedAt)} · Duration: ${sr.durationMin??'—'} min${sr.aborted?' · ABORTED: '+U.esc(sr.aborted.reason):''}</div></div>`).join('')}
    <div class="print-sec"><h3>Post-flight</h3>
      ${tickList(POSTFLIGHT_STEPS.map(st=>({on:f.postFlight.steps[st.n]&&f.postFlight.steps[st.n].ticked,label:st.n+' '+st.label,at:f.postFlight.steps[st.n]&&f.postFlight.steps[st.n].at})))}
      ${State.maintIssues.filter(i=>i.flightId===f.id).map(i=>`<div>Defect ${i.id}: ${U.esc(i.description)} (${i.severity}) — ${i.status}${i.rectification?' · rectified '+U.fmt(i.rectification.date)+' by '+U.esc(i.rectification.by):''}</div>`).join('')}
    </div>
    <div class="print-sec"><h3>Post-operation checklist</h3>
      ${tickList([
        {on:pit(1).ticked,label:'1 Drone flown confirmed',val:d?d.model:''},
        {on:!f.sorties.some(x=>x.takeoffAt&&!x.landedAt),label:'2 All sorties logged'},
        {on:pit(3).ticked,label:'3 Spotters confirmed'},
        {on:true,label:'4 Total flight hours',val:(totalMin/60).toFixed(2)+' h'},
        {on:batPostOk(f),label:'5 Battery post-flight state recorded'},
        {on:pit(6).ticked,label:'6 Media offloaded & backed up'},
        {on:!!pit(7).value,label:'7 Maintenance issues arising',val:pit(7).value},
        {on:!!pit(8).value,label:'8 Incidents / occurrences',val:pit(8).value},
        {on:!!pit(9).note,label:'9 Notes / lessons',note:pit(9).note}
      ])}
      ${f.postOp.occurrence?`<div><b>Occurrence:</b> ${U.esc(f.postOp.occurrence.severity||'')} — ${U.esc(f.postOp.occurrence.details||'')}${f.postOp.occurrence.atsb?` · ATSB ref ${U.esc(f.postOp.occurrence.atsb.ref||'')}, notified ${U.esc(f.postOp.occurrence.atsb.notifiedAtLocal||'')} by ${U.esc(f.postOp.occurrence.atsb.by||'')}`:''}</div>`:''}
    </div>
    <div class="print-sec"><h3>Alerts raised &amp; resolutions</h3>
      ${flightAlerts.length?`<table><tr><th>Severity</th><th>Alert</th><th>Resolution</th></tr>${flightAlerts.map(a=>`<tr><td>${a.severity}</td><td>${U.esc(a.message)}</td><td>${a.resolvedAt?U.esc((a.resolutionNote||'Resolved')+' — '+U.fmt(a.resolvedAt)):'OPEN'}</td></tr>`).join('')}</table>`:'<div>None raised.</div>'}
    </div>
    <div class="print-sec"><h3>Signatures</h3>
      <div>Submitted: ${f.submission?U.esc(f.submission.by+' ('+f.submission.initials+') — '+U.fmt(f.submission.at)):'—'}</div>
      <div>Approved &amp; filed: ${f.closure?U.esc(f.closure.by+' ('+f.closure.initials+') — '+U.fmt(f.closure.at)):'—'}</div>
      ${(f.amendments||[]).length?`<h3 style="margin-top:8px">Amendments</h3>${f.amendments.map(a=>`<div>${U.fmt(a.at)} · ${U.esc(a.by)}: ${U.esc(a.text)}</div>`).join('')}`:''}
    </div>
    <div class="print-foot">${U.esc(s.orgName)} · ${f.id} · Printed ${U.fmt(U.nowISO())} · Generated by ${U.esc(s.orgName)} Flight Operations System</div>
  </div>`;
  App.el('printRoot').innerHTML=doc;
  window.print();
}

Fleet.saveDrone=async function(id){
  const nick=$('#dNick').value.trim(), make=$('#dMake').value.trim(), model=$('#dModel').value.trim(), serial=$('#dSerial').value.trim(), type=$('#dType').value;
  if(!nick||!make||!model||!serial){ toast('Nickname, make, model and serial are required','err'); return; }
  const isOther = /Other — NOT on ReOC/.test(type);
  if(!id){
    const drone={ id:U.uid(), nickname:nick, make, model, typeCategory:type, serial, regStatus:$('#dRegStatus').value.trim(),
      regExpiry:$('#dRegExp').value||null, mtowKg:parseFloat($('#dMtow').value)||null, windLimit:parseFloat($('#dWind').value)||null,
      totalHours:parseFloat($('#dHours').value)||0, status: isOther?'Pending CASA approval':'Active', addedAt:U.nowISO(),
      createdAt:U.nowISO(), updatedAt:U.nowISO(), createdBy:App.currentActor };
    await saveEntity('drones','drones',drone);
    await createDefaultSchedules(drone);
    await logOpsManualEntry('Schedule 1 — Aircraft', 'Aircraft added — '+nick, `${make} ${model}, serial ${serial}, type category: ${type}`, drone.id);
    // change-event interceptor (5.2)
    if(isOther){
      await createChangeEvent({classification:'SIG',triggerType:'new-rpa-type',triggerRef:drone.id,description:`New RPA type requires CASA approval before operation: ${nick} (${make} ${model})`});
      toast('Drone saved — pending CASA approval, NOT flyable','err');
    } else {
      await createChangeEvent({classification:'NONSIG',triggerType:'new-drone-approved',triggerRef:drone.id,description:`New RPA of an approved type added — notify CASA via myCASA within 21 days (Schedule 1 update): ${nick}`});
      toast('Drone added — notify CASA within 21 days (Schedule 1)','ok');
    }
  } else {
    const drone=State.drone(id); const oldSerial=drone.serial;
    Object.assign(drone,{nickname:nick,make,model,typeCategory:type,serial,regStatus:$('#dRegStatus').value.trim(),
      regExpiry:$('#dRegExp').value||null,mtowKg:parseFloat($('#dMtow').value)||null,windLimit:parseFloat($('#dWind').value)||null,
      totalHours:parseFloat($('#dHours').value)||0,status:$('#dStatus').value});
    await saveEntity('drones','drones',drone);
    if(serial!==oldSerial){
      await logOpsManualEntry('Schedule 1 — Aircraft', 'Serial number changed — '+nick, `${oldSerial} → ${serial}`, drone.id);
      await createChangeEvent({classification:'NONSIG',triggerType:'serial-change',triggerRef:drone.id,description:`Serial number changed for ${nick} (${oldSerial} → ${serial}) — notify CASA within 21 days`});
      toast('Serial changed — CASA notification created','ok');
    } else toast('Drone updated','ok');
  }
  await audit('save','drone',id||'new',nick);
  Modal.closeAll(); await recompute(); Fleet.render();
};
Fleet.retireDrone=async function(id){
  const d=State.drone(id);
  const sameType=State.drones.filter(x=>x.id!==id && x.status!=='Retired-Sold-Written off' && x.typeCategory===d.typeCategory);
  Modal.closeAll();
  const reason=await confirmDialog({title:'Retire / sell / write off',message:`${d.nickname} will become non-assignable; its history is preserved. Record why.`,confirmLabel:'Retire aircraft',danger:true,requireReason:true});
  if(!reason) return;
  d.status='Retired-Sold-Written off'; d.removedAt=U.nowISO(); d.removalReason=reason;
  await saveEntity('drones','drones',d);
  await logOpsManualEntry('Schedule 1 — Aircraft', 'Aircraft retired/sold/written off — '+d.nickname, reason, id);
  if(sameType.length===0){
    const removeType=await confirmDialog({title:'Last aircraft of this type',message:`This was the last aircraft of type “${d.typeCategory}”. Is this type being removed from the ReOC? (Removing an RPA type requires CASA approval first.)`,confirmLabel:'Yes — remove the type (significant)'});
    if(removeType){ await createChangeEvent({classification:'SIG',triggerType:'remove-rpa-type',triggerRef:id,description:`Removal of RPA type “${d.typeCategory}” from the ReOC requires CASA approval`}); }
    else { await createChangeEvent({classification:'NONSIG',triggerType:'drone-removed',triggerRef:id,description:`Aircraft removed (Schedule 1 update): ${d.nickname} — notify CASA within 21 days`}); }
  } else {
    await createChangeEvent({classification:'NONSIG',triggerType:'drone-removed',triggerRef:id,description:`Aircraft removed (Schedule 1 update): ${d.nickname} — notify CASA within 21 days`});
  }
  await audit('retire','drone',id,reason); await recompute(); Fleet.render(); toast('Aircraft retired');
};

Fleet.saveIssue=async function(){

Fleet.saveRectify=async function(id){
  const i=State.maintIssues.find(x=>x.id===id);
  const work=$('#rWork').value.trim(); if(!work){ toast('Describe the rectification','err'); return; }
  const sig=readSignature('rBy', p=>(p.roles||[]).includes('Maintenance Controller')); if(!sig) return;
  i.status='Rectified'; i.rectification={ work, parts:$('#rParts').value.trim(), by:sig.by, initials:sig.initials, date:U.nowISO() };
  await saveEntity('maintIssues','maintIssues',i);
  await Alerts.resolve('issue:'+id, 'Rectified by '+sig.by);
  // if no more grounding issues, reactivate drone

const KEY_ROLES=['CEO','Chief Remote Pilot','Maintenance Controller'];
const ALL_ROLES=['CEO','Chief Remote Pilot','Maintenance Controller','Remote Pilot','Spotter','Camera operator','Other'];

  App.set(`<div class="page-head"><div class="grow"><h1>Personnel</h1><div class="page-sub">Pilots, crew, key personnel and currency. Recency rule: a logged flight within ${recDays} days.</div></div>

      const overridden=p.recencyOverride&&p.recencyOverride.date&&U.daysUntil(U.addDays(p.recencyOverride.date,recDays))>=0;

        <td style="font-size:.8rem">${U.esc((p.roles||[]).join(', '))}</td><td>${U.esc(p.replNumber||'—')}</td><td>${(p.totalHours||0).toFixed(1)}</td>

        <td>${needsRepl?'<span class="pill blocker">ATTENTION NEEDED</span>':`<span class="pill ${p.status==='Active'?'ok':'status'}">${U.esc(p.status)}</span>`}</td>

const People={};
People.edit=function(id){
  const p=id?State.person(id):null; const roles=(p?.roles)||[];
  const body=`<div class="field"><label class="req">Full name</label><input id="pName" value="${U.esc(p?.name||'')}"></div>
    <div class="field"><label class="req">Roles</label>${ALL_ROLES.map(r=>`<label class="tick ${roles.includes(r)?'on':''}" onclick="this.classList.toggle('on');const c=this.querySelector('input');c.checked=!c.checked"><span class="box">✓</span><span class="txt">${r}${KEY_ROLES.includes(r)?' <span class="pill status">key</span>':''}</span><input type="checkbox" data-role="${r}" ${roles.includes(r)?'checked':''} style="display:none"></label>`).join('')}
      <div class="hint">Assigning/removing a key role (CEO, Chief Remote Pilot, Maintenance Controller) triggers a significant CASA change.</div></div>
    <div class="inline"><div class="field"><label>RePL number</label><input id="pRepl" value="${U.esc(p?.replNumber||'')}"></div>
      <div class="field"><label>RePL date</label><input type="date" id="pReplDate" value="${U.esc(p?.replDate||'')}"></div></div>
    <div class="inline"><div class="field"><label>ARN</label><input id="pArn" value="${U.esc(p?.arn||'')}"></div>
      <div class="field"><label>Contact</label><input id="pContact" value="${U.esc(p?.contact||'')}"></div>

  Modal.open({title:id?'Edit Person':'Add Person',body,wide:true,
    footer:`<button class="btn ghost" onclick="Modal.closeAll()">Cancel</button><button class="btn primary" onclick="People.save(${id?`'${id}'`:'null'})">Save</button>`});
};
People.save=async function(id){
  const name=$('#pName').value.trim(); if(!name){ toast('Name required','err'); return; }
  const roles=$$('#modalRoot input[data-role]').filter(x=>x.checked).map(x=>x.dataset.role);
  const newStatus=$('#pStatus')?$('#pStatus').value:'Active';
  if(!id){ const p={ id:U.uid(), name, roles, replNumber:$('#pRepl').value.trim(), replDate:$('#pReplDate').value||null,
      arn:$('#pArn').value.trim(), contact:$('#pContact').value.trim(), status:'Active', totalHours:parseFloat($('#pHours').value)||0,
      lastFlightAt:null, createdAt:U.nowISO(), updatedAt:U.nowISO(), createdBy:App.currentActor };
    await saveEntity('people','people',p);
    // key role assignment on a brand-new person still triggers significant change
    for(const kr of roles.filter(r=>KEY_ROLES.includes(r))) await keyRoleChange(kr, p, null);
    await audit('add','person',p.id,name);
  } else {
    const p=State.person(id); const oldRoles=p.roles||[]; const oldStatus=p.status;
    // detect key-role changes BEFORE applying
    const addedKey=roles.filter(r=>KEY_ROLES.includes(r)&&!oldRoles.includes(r));
    const removedKey=oldRoles.filter(r=>KEY_ROLES.includes(r)&&!roles.includes(r));
    const deactivatingKeyHolder = oldStatus==='Active'&&newStatus==='Inactive'&&oldRoles.some(r=>KEY_ROLES.includes(r));
    Object.assign(p,{name,replNumber:$('#pRepl').value.trim(),replDate:$('#pReplDate').value||null,arn:$('#pArn').value.trim(),contact:$('#pContact').value.trim(),totalHours:parseFloat($('#pHours').value)||0});
    // roles/status held back if pending key change
    let heldPending=false;
    for(const kr of addedKey){ await keyRoleChange(kr,p,null); heldPending=true; }
    for(const kr of removedKey){ await keyRoleChange(kr,null,p); heldPending=true; }
    if(deactivatingKeyHolder){ await keyRoleChange(oldRoles.find(r=>KEY_ROLES.includes(r)),null,p); heldPending=true; }
    // apply non-key role changes and status immediately; key role part is applied on approval
    p.roles=roles; p.status=newStatus;
    if(heldPending){ /* keep applied but note pending in change event; effective holder tracked via keyRolePendingChange on the event */ }
    await saveEntity('people','people',p);
    await audit('edit','person',id,name);
  }
  Modal.closeAll(); await recompute(); Views.personnel(); toast('Person saved','ok');
};
async function keyRoleChange(role, incoming, outgoing){
  const desc = incoming&&!outgoing? `Key personnel change — ${role} assigned to ${incoming.name}`
    : outgoing&&!incoming? `Key personnel change — ${role} removed from ${outgoing.name}`
    : `Key personnel change — ${role}`;
  const ev=await createChangeEvent({classification:'SIG',triggerType:'key-personnel',triggerRef:(incoming||outgoing).id,description:desc+' (CASA approval required BEFORE implementation; assessment up to 70 business days)'});
  ev.keyRole={role, incomingId:incoming?incoming.id:null, outgoingId:outgoing?outgoing.id:null};
  await saveEntity('changeEvents','changeEvents',ev);
  await logOpsManualEntry('Personnel', desc, 'Pending CASA approval before implementation — see change event '+ev.id, (incoming||outgoing).id);
}

function changeTable(rows){
  rows=[...rows].sort((a,b)=>new Date(b.identifiedAt)-new Date(a.identifiedAt));
  return `<div class="tbl-wrap"><table class="data"><thead><tr><th>ID</th><th>Change</th><th>Identified</th><th>Status</th><th>Deadline / decision</th><th></th></tr></thead><tbody>
    ${rows.map(e=>{ let right='';
      if(e.classification==='NONSIG'){ const dl=U.daysUntil(e.deadline); right = e.status==='Notified'?`Notified ${U.fmtDate(e.casa.notifiedAt)}`:(dl<0?`<span class="pill blocker">OVERDUE ${-dl}d</span>`:`<span class="pill ${dl<=7?'warning':'info'}">${dl}d left</span>`); }
      else right = e.casa&&e.casa.decision?`<span class="pill ${e.casa.decision==='Approved'?'ok':'blocker'}">${e.casa.decision}</span>`:'<span class="pill warning">Awaiting CASA</span>';
      return `<tr style="cursor:pointer" onclick="Change.detail('${e.id}')"><td class="mono">${e.id}</td><td>${U.esc(e.description)}</td><td>${U.fmtDate(e.identifiedAt)}</td><td><span class="pill">${U.esc(e.status)}</span></td><td>${right}</td>
        <td class="actions"><button class="rowbtn" onclick="event.stopPropagation();Change.detail('${e.id}')">Open</button></td></tr>`; }).join('')}
    </tbody></table></div>`;
}
const Change={};
Change.detail=function(id){
  const e=State.changeEvent(id); if(!e) return;
  const sig=e.classification==='SIG';
  const body=`<div class="kv"><span class="k">ID</span><span class="v mono">${e.id}</span></div>
    <div class="kv"><span class="k">Classification</span><span class="v">${sig?'🔴 Significant':'🟡 Non-significant'}</span></div>
    <div class="kv"><span class="k">Description</span><span class="v" style="text-align:left;font-weight:400">${U.esc(e.description)}</span></div>
    <div class="kv"><span class="k">Identified</span><span class="v">${U.fmt(e.identifiedAt)}</span></div>
    <div class="kv"><span class="k">Status</span><span class="v">${U.esc(e.status)}</span></div>
    ${!sig?`<div class="kv"><span class="k">Deadline (21 days)</span><span class="v">${U.fmtDate(e.deadline)}</span></div>`:''}
    ${e.keyRole?`<div class="alert warning" style="margin-top:10px"><span class="ai">🟠</span><div class="abody"><div class="atitle">Key personnel change pending CASA approval</div><div class="awhy">${keyRoleStatusText(e)}</div><div class="afix">Key personnel changes require CASA approval before implementation. Assessment can take up to 70 business days — plan ahead.</div></div></div>`:''}
    <div class="divider"></div>
    ${sig? `<div class="section-title">Significant event — application lifecycle</div>
      <div class="field"><label>Status</label><select id="ceStatus">${['Identified','Application prepared','Submitted to CASA','Approved','Rejected'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="inline"><div class="field"><label>Application date</label><input type="date" id="ceAppDate" value="${U.esc(e.casa.applicationDate||'')}"></div>
        <div class="field"><label>CASA reference</label><input id="ceRef" value="${U.esc(e.casa.reference||'')}"></div></div>
      <div class="inline"><div class="field"><label>Decision</label><select id="ceDecision"><option value="">—</option><option ${e.casa.decision==='Approved'?'selected':''}>Approved</option><option ${e.casa.decision==='Rejected'?'selected':''}>Rejected</option></select></div>
        <div class="field"><label>Decision date</label><input type="date" id="ceDecDate" value="${U.esc(e.casa.decisionAt||'')}"></div></div>`
      : `<div class="section-title">Non-significant event — myCASA notification</div>
      <div class="inline"><div class="field"><label>Notification date</label><input type="date" id="ceNotifDate" value="${U.esc(e.casa.notifiedAt||'')}"></div>
        <div class="field"><label>myCASA reference</label><input id="ceRef" value="${U.esc(e.casa.reference||'')}"></div></div>`}
    <div class="field"><label>Documents / notes</label><input id="ceDocs" value="${U.esc(e.casa.docs||'')}"></div>
    <div class="section-title" style="margin-top:12px">History</div>${(e.history||[]).map(h=>`<div class="kv"><span class="k">${U.fmt(h.at)}</span><span class="v" style="font-weight:400;text-align:left">${U.esc(h.note)}</span></div>`).join('')}`;
  Modal.open({title:'Change event '+e.id,body,wide:true,
    footer:`<button class="btn ghost" onclick="Modal.closeAll()">Close</button><button class="btn primary" onclick="Change.save('${id}')">Save</button>`});
};
function keyRoleStatusText(e){
  const inc=e.keyRole.incomingId?State.person(e.keyRole.incomingId):null;
  const out=e.keyRole.outgoingId?State.person(e.keyRole.outgoingId):null;
  if(inc&&!out) return `Incoming (pending CASA): ${inc.name} for ${e.keyRole.role}. Not effective until approval recorded.`;
  if(out&&!inc) return `Removing ${out.name} from ${e.keyRole.role} — pending CASA approval.`;
  return `${e.keyRole.role} change pending CASA approval.`;
}
Change.save=async function(id){
  const e=State.changeEvent(id); const sig=e.classification==='SIG';
  if(sig){
    e.status=$('#ceStatus').value; e.casa.applicationDate=$('#ceAppDate').value||null; e.casa.reference=$('#ceRef').value.trim();
    e.casa.decision=$('#ceDecision').value||null; e.casa.decisionAt=$('#ceDecDate').value||null;
    if(e.casa.decision==='Approved'){ e.status='Approved'; await Alerts.resolve('chg-sig:'+id,'CASA approved '+(e.casa.reference||''));
      // apply pending drone type / key role now
      if(e.triggerType==='new-rpa-type'&&e.triggerRef){ const d=State.drone(e.triggerRef); if(d&&d.status==='Pending CASA approval'){ d.status='Active'; await saveEntity('drones','drones',d); } }
      e.history.push({at:U.nowISO(),note:'CASA approval recorded — change may be implemented',by:App.currentActor});
    } else if(e.casa.decision==='Rejected'){ e.status='Rejected'; e.history.push({at:U.nowISO(),note:'CASA rejected the application',by:App.currentActor}); }
    else e.history.push({at:U.nowISO(),note:'Updated: status '+e.status,by:App.currentActor});
  } else {
    e.casa.notifiedAt=$('#ceNotifDate').value||null; e.casa.reference=$('#ceRef').value.trim();
    if(e.casa.notifiedAt&&e.casa.reference){ e.status='Notified'; await Alerts.resolve('chg-nonsig:'+id,'Notified via myCASA '+e.casa.reference);
      e.history.push({at:U.nowISO(),note:'myCASA notification recorded ('+e.casa.reference+')',by:App.currentActor}); }
  }
  e.casa.docs=$('#ceDocs').value.trim();
  await saveEntity('changeEvents','changeEvents',e);
  await audit('update','changeEvent',id,e.status);
  Modal.closeAll(); await recompute(); Views.changes(); toast('Change event updated','ok');
};

  const opts=[...Classifier.SIGNIFICANT.map(x=>({...x,cls:'SIG'})),...Classifier.NONSIGNIFICANT.map(x=>({...x,cls:'NONSIG'})),{key:'other',label:'Other change (not listed)',cls:'?'}];
  const body=`<div class="alert warning"><span class="ai">⚠</span><div class="abody"><div class="atitle">Watch-out rule</div><div class="awhy">${Classifier.WATCHOUT}</div></div></div>
    <div class="field"><label class="req">What changed?</label><select id="cwWhat" onchange="Change.wizPick()">

      <optgroup label="🟡 Non-significant — notify within 21 days">${Classifier.NONSIGNIFICANT.map(x=>`<option value="NONSIG:${x.key}">${U.esc(x.label)}</option>`).join('')}</optgroup>

  Modal.open({title:'Log a Change',body,wide:true,footer:`<button class="btn ghost" onclick="Modal.closeAll()">Cancel</button><button class="btn primary" onclick="Change.wizSave()">Create change event</button>`});

Change.wizPick=function(){
  const v=$('#cwWhat').value; const isOther=v.startsWith('OTHER');
  $('#cwOther').style.display=isOther?'block':'none';
  const cls=isOther?($('#cwBucket')?.value||'SIG'):v.split(':')[0];
  $('#cwClass').innerHTML= cls==='SIG'?'<span style="color:var(--blocker)">🔴 Significant — do NOT implement until CASA approves.</span>':'<span style="color:var(--nonsig)">🟡 Non-significant — proceed, but notify CASA within 21 days.</span>';
};
Change.wizSave=async function(){
  const v=$('#cwWhat').value; const isOther=v.startsWith('OTHER');
  const cls=isOther?$('#cwBucket').value:v.split(':')[0]; const key=v.split(':')[1];
  const desc=$('#cwDesc').value.trim(); if(!desc){ toast('Describe the change','err'); return; }
  await createChangeEvent({classification:cls,triggerType:'manual:'+key,triggerRef:null,description:desc});
  Modal.closeAll(); await recompute(); Views.changes(); toast('Change event created','ok');
};
