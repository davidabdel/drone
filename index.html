<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ReOC Flight Operations</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C2A20'/%3E%3Cg stroke='%23ffffff' stroke-width='6' stroke-linecap='round'%3E%3Cline x1='32' y1='32' x2='14' y2='14'/%3E%3Cline x1='32' y1='32' x2='50' y2='14'/%3E%3Cline x1='32' y1='32' x2='14' y2='50'/%3E%3Cline x1='32' y1='32' x2='50' y2='50'/%3E%3C/g%3E%3Ccircle cx='14' cy='14' r='8' fill='%23ffffff'/%3E%3Ccircle cx='50' cy='14' r='8' fill='%23ffffff'/%3E%3Ccircle cx='14' cy='50' r='8' fill='%23ffffff'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================= *
 *  ReOC Flight Operations — single-file app stylesheet          *
 *  Design: "Action queue" (AVS redesign, Jul 2026). Fixed light  *
 *  theme with a dark sidebar/rail — deliberately does not follow *
 *  prefers-color-scheme; the redesign commits to one look.       *
 *  Colour policy: red/amber reserved for alert severities.       *
 * ============================================================= */
:root{
  --bg:#F4F6F3; --panel:#ffffff; --panel-2:#F1F3F0; --panel-3:#FAFBF9;
  --ink:#10201A; --ink-2:#4C584F; --ink-3:#7A867E;
  --line:#E4E8E3; --line-2:#D5DAD4;
  --brand:#0C2A20; --brand-2:#14663F; --brand-ink:#ffffff;
  --brand-tint:#2E5A47; --brand-tint-ink:#CDE9DA;
  --sidebar-muted:#B7C9C0; --sidebar-faint:#6E8C7F; --sidebar-faint-2:#8AA79A; --sidebar-faint-3:#7E9C8F;
  --accent:#334155;
  --blocker:#B3261E; --blocker-solid:#8E2018; --blocker-bg:#FBE7E3; --blocker-line:#EFD9D5; --blocker-ink:#8C3B33;
  --warning:#E5A93B; --warning-dot:#C4870F; --warning-bg:#FBEFD8; --warning-line:#E9E2CF; --warning-ink:#8A5D07;
  --info:#2563eb; --info-bg:#eff6ff; --info-line:#bfdbfe;
  --ok:#2E7D5B; --ok-bg:#f0fdf4; --nonsig:#ca8a04; --nonsig-bg:#fefce8;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(16,32,26,.05),0 18px 40px rgba(16,32,26,.07);
  --shadow-lg:0 10px 30px rgba(16,32,26,.14);
  --tap:46px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Instrument Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:650}
h1{font-size:1.4rem}h2{font-size:1.15rem}h3{font-size:1rem}h4{font-size:.9rem}
p{margin:0 0 .6em}
a{color:var(--info)}
small{color:var(--ink-3)}
code,.mono{font-family:var(--mono)}
button{font-family:inherit}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:236px;flex:0 0 236px;background:var(--brand);border-right:0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;padding:20px 14px;gap:26px}
.brandbar{padding:0 8px;border-bottom:0}
.brandbar .org{font-weight:600;font-size:.9rem;color:#fff;line-height:1.35}
.brandbar .orgsub{font-size:.8rem;color:var(--sidebar-faint-2)}
.brandbar .reoc{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--sidebar-faint);margin-top:8px}
.navlist{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.navlist li{margin:0}
.navlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
  color:var(--sidebar-muted);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:500}
.navlink .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22);flex:0 0 5px}
.navlink .ico{width:20px;text-align:center;font-size:1.05rem;display:none}
.navlink:hover{background:rgba(255,255,255,.07);color:#fff}
.navlink.active{background:rgba(255,255,255,.11);color:#fff;font-weight:600}
.navlink.active .dot{background:#8FD6A8}
.navlink .badge{margin-left:auto;background:var(--blocker);color:#fff;border-radius:20px;font-family:var(--mono);
  font-size:.66rem;font-weight:600;min-width:18px;height:18px;padding:0 6px;display:none;align-items:center;justify-content:center}
.navlink .badge.warn{background:var(--warning);color:var(--brand)}
.navlink .badge.show{display:inline-flex}
.navfoot{padding:0;border-top:0;font-size:.7rem;color:var(--sidebar-faint);margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sb-backup{padding:12px;border-radius:10px;background:rgba(255,255,255,.06)}
.sb-backup .lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;color:var(--sidebar-faint)}
.sb-backup .val{font-size:.8rem;color:#fff;margin-top:4px}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px;cursor:pointer;border-radius:8px}
.sb-user:hover{background:rgba(255,255,255,.06)}
.sb-user .av{width:26px;height:26px;border-radius:50%;background:var(--brand-tint);color:var(--brand-tint-ink);
  font-size:.68rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.sb-user .who{font-size:.78rem;color:var(--sidebar-muted);line-height:1.3}
.sb-user .role{font-size:.68rem;color:var(--sidebar-faint)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
#view{padding:20px 24px 90px;max-width:1200px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-head .grow{flex:1;min-width:200px}
.page-head h1{margin-bottom:2px}
.page-sub{color:var(--ink-3);font-size:.86rem}

/* ---------- cards & panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card > h2:first-child,.card > h3:first-child{margin-top:0}
.section-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin:0 0 10px}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--ink-3)}
.divider{height:1px;background:var(--line);border:0;margin:14px 0}

/* ---------- stat tiles ---------- */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .num{font-size:1.7rem;font-weight:750;line-height:1}
.stat .lbl{font-size:.74rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);
  background:var(--panel);color:var(--ink);padding:0 15px;height:var(--tap);min-height:40px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:.9rem;font-weight:600;transition:filter .12s,background .12s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:34px;min-height:34px;padding:0 11px;font-size:.83rem}
.btn.lg{height:56px;font-size:1.02rem;padding:0 22px;width:100%}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--brand)}
.btn.danger{background:var(--blocker);border-color:var(--blocker);color:#fff}
.btn.danger:hover:not(:disabled){filter:brightness(1.05);background:var(--blocker)}
.btn.ghost{background:none;border-color:transparent}
.btn.warn{background:var(--warning);border-color:var(--warning);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn .ico{font-size:1.05em}

/* ---------- forms ---------- */
.field{margin-bottom:13px}
.field > label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-size:.74rem;color:var(--ink-3);margin-top:4px}
.req::after{content:" *";color:var(--blocker)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],
input[type=email],input[type=tel],select,textarea{
  width:100%;font-family:inherit;font-size:.92rem;color:var(--ink);background:var(--panel);
  border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:10px 11px;min-height:42px}
textarea{min-height:74px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input.invalid,select.invalid{border-color:var(--blocker)}
.inline{display:flex;gap:10px;flex-wrap:wrap}
.inline > .field{flex:1;min-width:130px;margin-bottom:0}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}

/* checkbox / tick toggle (big tap targets) */
.tick{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line-2);border-radius:var(--radius-sm);
  cursor:pointer;background:var(--panel);min-height:var(--tap);user-select:none;transition:background .12s,border-color .12s}
.tick:hover{background:var(--panel-2)}
.tick .box{flex:0 0 26px;width:26px;height:26px;border:2px solid var(--line-2);border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-size:.95rem;color:transparent;font-weight:800}
.tick.on{background:var(--ok-bg);border-color:var(--ok)}
.tick.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.tick .txt{flex:1}
.tick .txt .n{font-size:.72rem;color:var(--ink-3)}
.tick .ts{font-size:.7rem;color:var(--ink-3);font-family:var(--mono)}

/* ---------- badges / pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.pill.blocker{background:var(--blocker-bg);color:var(--blocker);border-color:var(--blocker-line)}
.pill.warning{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-line)}
.pill.info{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.nonsig{background:var(--nonsig-bg);color:var(--nonsig);border-color:var(--warning-line)}
.pill.status{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- alerts ---------- */
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);
  border:1px solid;margin-bottom:9px;font-size:.86rem}
.alert .ai{font-size:1.05rem;line-height:1.2}
.alert .abody{flex:1;min-width:0}
.alert .atitle{font-weight:700}
.alert .awhy{color:var(--ink-2);font-size:.8rem;margin-top:2px}
.alert .afix{font-size:.8rem;margin-top:4px}
.alert.blocker{background:var(--blocker-bg);border-color:var(--blocker-line);color:var(--blocker)}
.alert.warning{background:var(--warning-bg);border-color:var(--warning-line);color:var(--warning)}
.alert.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.alert .atitle,.alert .awhy,.alert .afix{color:var(--ink)}
.alert-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:.85rem}
table.data th,table.data td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
table.data th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;background:var(--panel-2)}
table.data tr:hover td{background:var(--panel-2)}
table.data td.actions{text-align:right;white-space:nowrap}
.rowbtn{background:none;border:0;color:var(--info);cursor:pointer;font-weight:600;font-size:.83rem;padding:4px 6px}
.rowbtn.del{color:var(--blocker)}

/* repeating table editor */
.rep{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.rep-row{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line);align-items:flex-end;flex-wrap:wrap}
.rep-row:last-child{border-bottom:0}
.rep-row .field{margin-bottom:0}

/* ---------- stepper ---------- */
.stepper{display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;margin-bottom:6px}
.step{flex:1;min-width:80px;text-align:center;position:relative;padding-top:22px;font-size:.66rem;color:var(--ink-3);cursor:default}
.step::before{content:"";position:absolute;top:6px;left:0;right:0;height:3px;background:var(--line)}
.step .num{position:absolute;top:0;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;
  background:var(--line);color:var(--panel);font-size:.6rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.step.done{color:var(--ok)}.step.done::before{background:var(--ok)}.step.done .num{background:var(--ok);color:#fff}
.step.current{color:var(--brand);font-weight:700}.step.current::before{background:var(--brand)}.step.current .num{background:var(--brand);color:var(--brand-ink)}
.step.cancel{color:var(--blocker)}.step.cancel::before{background:var(--blocker)}.step.cancel .num{background:var(--blocker);color:#fff}

/* sequential procedure steps */
.procstep{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden}
.procstep .ph{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer}
.procstep .pn{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem}
.procstep.done .pn{background:var(--ok);color:#fff;border-color:var(--ok)}
.procstep.locked{opacity:.55}
.procstep .pbody{padding:0 13px 13px 52px;display:none}
.procstep.open .pbody{display:block}
.procstep .ptitle{flex:1;font-weight:600;font-size:.9rem}

/* flight cards */
.flightcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .12s}
.flightcard:hover{box-shadow:var(--shadow-lg)}
.flightcard .fid{font-family:var(--mono);font-size:.78rem;color:var(--ink-3)}
.flightcard .floc{font-weight:700;margin:2px 0}
.flightcard .fmeta{font-size:.78rem;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:640px;
  border:1px solid var(--line);animation:pop .16s ease}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0}
.modal-head .x{margin-left:auto;background:none;border:0;font-size:1.4rem;color:var(--ink-3);cursor:pointer;line-height:1}
.modal-body{padding:18px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:24px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow-lg);animation:pop .16s}
.toast.err{background:var(--blocker);color:#fff}
.toast.ok{background:var(--ok);color:#04140c}

/* ---------- CASA/ReOC assistant chat bubble ---------- */
.chat-bubble{display:none;position:fixed;right:22px;bottom:22px;width:54px;height:54px;border-radius:50%;
  background:var(--brand);color:#fff;border:0;font-size:1.4rem;cursor:pointer;box-shadow:var(--shadow-lg);z-index:150;
  align-items:center;justify-content:center}
.chat-bubble.show{display:flex}
.chat-panel{display:none;position:fixed;right:22px;bottom:88px;width:360px;max-width:calc(100vw - 32px);
  height:min(520px,70vh);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);z-index:150;flex-direction:column;overflow:hidden}
.chat-panel.open{display:flex}
.chat-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;background:var(--brand);color:#fff}
.chat-title{font-weight:600;font-size:.92rem}
.chat-sub{font-size:.72rem;color:var(--sidebar-faint-2);margin-top:2px;line-height:1.35}
.chat-head .x{margin-left:auto;background:none;border:0;color:#fff;font-size:1.3rem;cursor:pointer;line-height:1;opacity:.8}
.chat-head .x:hover{opacity:1}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chat-msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:.85rem;line-height:1.5}
.chat-msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
.chat-msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px;white-space:pre-wrap}
.chat-msg.bot.pending{color:var(--ink-3);font-style:italic}
.chat-msg.err{align-self:flex-start;background:var(--blocker-bg);border:1px solid var(--blocker-line);color:var(--blocker-ink)}
.chat-empty{color:var(--ink-3);font-size:.82rem;text-align:center;padding:20px 10px}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel)}
.chat-input-row input{flex:1;min-height:38px;padding:8px 10px;font-size:.86rem}
@media (max-width:820px){
  .chat-bubble{bottom:78px}
  .chat-panel{bottom:140px;right:12px;left:12px;width:auto;max-width:none}
}

/* backup banner */
#backupBanner{background:var(--warning-bg);border-bottom:1px solid var(--warning-line);color:var(--ink);
  padding:9px 18px;font-size:.83rem;display:none;align-items:center;gap:12px}
#backupBanner.show{display:flex}
#backupBanner .bx{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:1.1rem}

.guide h4{margin:16px 0 6px;font-size:.92rem;color:var(--ink)}
.guide h4:first-child{margin-top:0}
.guide p{line-height:1.55;margin:0 0 8px}
.guide ul{margin:6px 0 10px;padding-left:20px}
.guide li{margin:3px 0;line-height:1.5}
.guide a{word-break:break-word}
.guidecard{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer;background:var(--panel);transition:background .12s}
.guidecard:hover{background:var(--panel-2)}
.guidecard .gi{font-size:1.2rem;line-height:1.2}
.empty{text-align:center;padding:34px 20px;color:var(--ink-3)}
.empty .big{font-size:2rem;margin-bottom:8px}
.sig-line{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:600;text-align:right}

/* ---------- Operations Manual (reading view) ---------- */
.om-toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.om-toc a{display:block;padding:8px 10px;border-radius:8px;font-size:.85rem;font-weight:600;color:var(--ink);border:1px solid var(--line)}
.om-toc a:hover{background:var(--panel-2);text-decoration:none}

/* ---------- Action queue (Dashboard) ---------- */

@media (max-width:1050px){.aq-grid{grid-template-columns:1fr}}

.aq-section-head .cnt.blocker{color:var(--blocker-ink);background:var(--blocker-bg)}
.aq-section-head .cnt.warning{color:var(--warning-ink);background:var(--warning-bg)}

  border-style:solid;border-width:1px 1px 1px 3px;border-radius:11px}
.aq-card.blocker{border-color:var(--blocker-line) var(--blocker-line) var(--blocker-line) var(--blocker)}
.aq-card.warning{border-color:var(--warning-line) var(--warning-line) var(--warning-line) var(--warning);align-items:center;padding:14px 18px}

.aq-title.sm{font-size:.88rem}
.aq-desc{font-size:.86rem;line-height:1.55;color:var(--ink-2);margin-top:4px}
.aq-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.aq-tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--ink-3);background:var(--panel-2);
  border:1px solid var(--line);padding:3px 7px;border-radius:5px;white-space:nowrap}
.aq-fix{font-size:.83rem;color:var(--ink-3)}
.aq-actions{display:flex;gap:8px;flex-shrink:0}
.btn.aq-ghost{background:transparent;border-color:var(--line-2);color:var(--ink-2);height:auto;padding:7px 11px;font-size:.82rem}
.btn.aq-danger{background:var(--blocker-solid);border-color:var(--blocker-solid);color:#fff;height:auto;padding:7px 13px;font-size:.82rem;font-weight:600}
.btn.aq-text{background:none;border:0;color:var(--ink-3);height:auto;padding:7px 4px;font-size:.82rem}
.btn.aq-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.aq-currency{background:var(--panel);border-style:solid;border-width:1px 1px 1px 3px;border-color:var(--warning-line) var(--warning-line) var(--warning-line) var(--warning);border-radius:11px;overflow:hidden}

.aq-fleet-row.grounded .dot{background:var(--blocker)}
.aq-fleet-row.available .dot{background:var(--ok)}
.aq-fleet-row .name{font-size:.9rem;font-weight:600;flex:1}
.aq-fleet-row .tag{font-family:var(--mono);font-size:.68rem}

/* ---------- mobile ---------- */
@media (max-width:820px){
  #sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;
    border-right:0;border-top:0;z-index:40;padding:0}

  .navlist{position:absolute;left:0;right:0;bottom:100%;display:flex;flex-direction:column;
    padding:6px 8px 10px;gap:2px;max-height:65vh;overflow-y:auto;background:var(--brand);
    border-bottom:1px solid rgba(255,255,255,.08);
    transform:translateY(10px);opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease}

  .navlist li{flex:none}
  .navlink{flex-direction:row;gap:10px;padding:11px 12px;font-size:.86rem;text-align:left;justify-content:flex-start}
  .navlink .dot{display:none}
  .navlink .ico{display:block;font-size:1.1rem;width:20px;text-align:center}
  .navlink .lbl-txt{white-space:nowrap}
  .navlink .badge{position:static;margin-left:auto}
  .navlink{position:relative}
  #navbackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  #navbackdrop.show{display:block}
  #view{padding:14px 13px 66px}
  .topbar{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--brand);border-bottom:0;
    position:sticky;top:0;z-index:20}
  .topbar .org{font-weight:600;font-size:.88rem;color:#fff}
  .topbar .reoc{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;color:var(--sidebar-faint-2)}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
  .stat .num{font-size:1.4rem}
}
@media (min-width:821px){.topbar{display:none}}

/* ---- phones: reflow data tables into stacked labelled cards ---- */
@media (max-width:600px){
  .tbl-wrap{overflow-x:visible}
  table.data thead{display:none}
  table.data, table.data tbody, table.data tr, table.data td{display:block;width:100%}
  table.data tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel);overflow:hidden}
  table.data tr:hover td{background:transparent}
  table.data td{border:0;border-top:1px solid var(--line);padding:9px 13px;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right;font-size:.9rem}
  table.data td::before{content:attr(data-label);font-weight:600;color:var(--ink-3);text-align:left;flex:0 0 40%;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em}
  table.data td:first-child{border-top:0;background:var(--panel-2);font-weight:700;font-size:1rem;justify-content:flex-start;text-align:left}
  table.data td:first-child::before{display:none}
  table.data td.actions{justify-content:flex-end}
  table.data td.actions::before{display:none}

  #view{padding:12px 11px 90px}
  .page-head h1{font-size:1.25rem}
  .card{padding:13px}
}

@media print{
  @page{size:A4 portrait;margin:14mm}
  body{background:#fff;color:#000;font-size:11px}
  #sidebar,.topbar,#backupBanner,#toasts,.modal-back,.no-print,.btn,.stepper,.navlink{display:none !important}
  #app{display:block}
  #main{display:block}
  #view{padding:0;max-width:none}

  #view > *:not(#printRoot){display:none !important}
  .print-doc{color:#000}

  .print-head .org{font-size:15px;font-weight:800}

  .print-sec h3{font-size:12px;border-bottom:1px solid #999;padding-bottom:3px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .print-doc table{width:100%;border-collapse:collapse;font-size:10.5px;margin:4px 0}

  .print-doc .kv{border-bottom:1px solid #ddd}
  .print-tick::before{content:"\2713  ";font-weight:700}
  .print-foot{position:fixed;bottom:0;left:0;right:0;font-size:9px;color:#444;border-top:1px solid #ccc;padding-top:3px}
  .pagebreak{page-break-before:always}
}

<script>
"use strict";
/* =================================================================
 *  ReOC Flight Operations — application logic (single file)
 *  Sections: Store · Util · State · Alerts · Classifier · Router
 *            Dashboard · Flights · Fleet · Battery · Maintenance
 *            Personnel · Change Events · Settings · Setup · Print
 * ================================================================= */

/* ---------------------------------------------------------------- *
 *  1. STORE — single data-access module (IndexedDB + LS fallback)
 *     Swap this module for a cloud backend without touching UI.
 * ---------------------------------------------------------------- */
const Store = (function(){
  const DB_NAME = 'reoc_flight_ops';
  const DB_VER = 2; // bumped to add opsManualEntries — existing IndexedDBs get the new store via onupgradeneeded
  const STORES = ['settings','people','drones','batteries','maintSchedules',
                  'maintRecords','maintIssues','flights','changeEvents','alerts','auditLog','counters','opsManualEntries'];
  let db = null, useLS = false;

  /* --- Supabase cloud backend (publishable key — safe to embed) --- */
  // Config is fetched from /api/config (Vercel serverless fn reading env vars)
  // so keys are NOT baked into this file. Falls back to local-only if absent.
  const SUPA = { url: '', key: '', table: 'reoc_store' };
  async function loadConfig(){
    try{
      const r = await fetch('/api/config', { cache:'no-store' });
      if(!r.ok) return;
      const c = await r.json();
      if(c && c.url) SUPA.url = String(c.url).replace(/\/+$/,'') + '/rest/v1';
      if(c && c.key) SUPA.key = c.key;
    }catch(e){ /* no cloud config reachable — run local-only */ }
  }
  let remoteOn = false;               // last known cloud reachability
  const QKEY = 'reoc_sync_queue';     // offline write-retry queue

  function H(extra){ return Object.assign({ apikey:SUPA.key, Authorization:'Bearer '+SUPA.key, 'Content-Type':'application/json' }, extra||{}); }
  const rowUrl = (store,id)=> `${SUPA.url}/${SUPA.table}?store=eq.${encodeURIComponent(store)}${id!=null?`&id=eq.${encodeURIComponent(id)}`:''}`;
  async function rUpsert(store,obj){
    const r = await fetch(`${SUPA.url}/${SUPA.table}`, { method:'POST', headers:H({Prefer:'resolution=merge-duplicates'}),
      body:JSON.stringify({ store, id:obj.id, data:obj, updated_at:new Date().toISOString() }) });
    if(!r.ok) throw new Error('upsert '+r.status);
  }
  async function rDel(store,id){ const r=await fetch(rowUrl(store,id),{method:'DELETE',headers:H()}); if(!r.ok) throw new Error('del '+r.status); }
  async function rClear(store){ const r=await fetch(rowUrl(store),{method:'DELETE',headers:H()}); if(!r.ok) throw new Error('clear '+r.status); }
  async function rPullAll(){ const r=await fetch(`${SUPA.url}/${SUPA.table}?select=store,id,data`,{headers:H()}); if(!r.ok) throw new Error('pull '+r.status); return r.json(); }

  function getQueue(){ try{ return JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(e){ return []; } }
  function setQueue(q){ localStorage.setItem(QKEY, JSON.stringify(q)); }
  function enqueue(task){ const q=getQueue(); q.push(task); setQueue(q); remoteOn=false; }
  function runTask(t){ return t.op==='put'? rUpsert(t.store,t.obj) : t.op==='del'? rDel(t.store,t.id) : rClear(t.store); }
  // fire-and-forget remote write; queue on failure so nothing is lost offline
  function send(task){ if(!SUPA.key) return; runTask(task).then(()=>{ remoteOn=true; }).catch(()=>enqueue(task)); }
  async function flushQueue(){
    if(!SUPA.key) return;
    let q=getQueue(); if(!q.length) return;
    const remaining=[];
    for(const t of q){ try{ await runTask(t); }catch(e){ remaining.push(t); } }
    setQueue(remaining); remoteOn = remaining.length===0;
  }
  async function pull(){
    if(!SUPA.key) return false;
    let rows; try{ rows = await rPullAll(); }catch(e){ remoteOn=false; return false; }
    const byStore={}; STORES.forEach(s=>byStore[s]=[]);
    rows.forEach(row=>{ if(byStore[row.store]) byStore[row.store].push(row.data); });
    for(const s of STORES){ await lClear(s); for(const o of byStore[s]) await lPut(s,o); }
    remoteOn=true; return true;
  }

  /* --- local cache (IndexedDB, or localStorage fallback) --- */
  function openLocal(){
    return new Promise((resolve)=>{
      if(!('indexedDB' in window)){ useLS = true; return resolve(); }
      let req;
      try{ req = indexedDB.open(DB_NAME, DB_VER); }
      catch(e){ useLS = true; return resolve(); }
      req.onupgradeneeded = e=>{
        const d = e.target.result;
        STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'}); });
      };
      req.onsuccess = e=>{ db = e.target.result; resolve(); };
      req.onerror = ()=>{ useLS = true; resolve(); };
    });
  }
  const lsKey = s=>'reoc_'+s;
  function lsAll(s){ try{ return JSON.parse(localStorage.getItem(lsKey(s))||'[]'); }catch(e){ return []; } }
  function lsWrite(s,arr){ localStorage.setItem(lsKey(s),JSON.stringify(arr)); }
  function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }

  async function lAll(store){
    if(useLS) return lsAll(store);
    return new Promise((res,rej)=>{ const r = tx(store,'readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
  }
  async function lGet(store,id){
    if(useLS) return lsAll(store).find(x=>x.id===id)||null;
    return new Promise((res,rej)=>{ const r = tx(store,'readonly').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  }
  async function lPut(store,obj){
    if(useLS){ const a=lsAll(store); const i=a.findIndex(x=>x.id===obj.id); if(i>=0)a[i]=obj; else a.push(obj); lsWrite(store,a); return obj; }
    return new Promise((res,rej)=>{ const r = tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); });
  }
  async function lDel(store,id){
    if(useLS){ lsWrite(store, lsAll(store).filter(x=>x.id!==id)); return; }
    return new Promise((res,rej)=>{ const r = tx(store,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
  }
  async function lClear(store){
    if(useLS){ lsWrite(store,[]); return; }
    return new Promise((res,rej)=>{ const r = tx(store,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
  }

  /* --- public API (identical signatures; reads = local cache, writes = local + cloud) --- */
  async function open(){
    await openLocal();
    await loadConfig();   // fetch Supabase URL/key from /api/config (Vercel env)
    await flushQueue();   // push anything written while offline
    await pull();         // then refresh local cache from the cloud (source of truth)
    if('addEventListener' in window) window.addEventListener('online', ()=>{ flushQueue(); });
  }
  async function all(store){ return lAll(store); }
  async function get(store,id){ return lGet(store,id); }
  async function put(store,obj){ await lPut(store,obj); send({op:'put',store,obj}); return obj; }
  async function del(store,id){ await lDel(store,id); send({op:'del',store,id}); }
  async function clear(store){ await lClear(store); send({op:'clear',store}); }
  async function exportAll(){ const out={}; for(const s of STORES) out[s]=await lAll(s); return out; }
  async function importAll(data){
    for(const s of STORES){ await lClear(s); try{ await rClear(s); }catch(e){ enqueue({op:'clear',store:s}); }
      const rows=data[s]||[]; for(const row of rows){ await lPut(s,row); send({op:'put',store:s,obj:row}); } }
  }
  async function wipe(){ for(const s of STORES){ await lClear(s); try{ await rClear(s); }catch(e){ enqueue({op:'clear',store:s}); } } }

  return { open, all, get, put, del, clear, exportAll, importAll, wipe, STORES,
           isLS:()=>useLS, isRemote:()=>remoteOn, cloudUrl:()=>SUPA.url, pull, flushQueue,
           pendingWrites:()=>getQueue().length };
})();

/* ---------------------------------------------------------------- *
 *  2. UTIL — ids, dates, dom, formatting
 * ---------------------------------------------------------------- */
const U = (function(){
  const uid = ()=> 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const nowISO = ()=> new Date().toISOString();
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmt(iso){
    if(!iso) return '—';
    const d = new Date(iso); if(isNaN(d)) return '—';
    const p = n=>String(n).padStart(2,'0');
    return `${p(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso); if(isNaN(d)) return '—';
    return `${String(d.getDate()).padStart(2,'0')} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  }
  const todayStr = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  function daysBetween(a,b){ return Math.floor((new Date(b) - new Date(a))/86400000); }
  function daysUntil(iso){ if(!iso) return null; return Math.ceil((new Date(iso) - Date.now())/86400000); }
  function addDays(iso,n){ const d = new Date(iso); d.setDate(d.getDate()+n); return d.toISOString(); }
  function addMonths(iso,n){ const d = new Date(iso); d.setMonth(d.getMonth()+n); return d.toISOString(); }
  // escape for html
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // seq id per prefix+year, using counters store
  async function seqId(prefix){
    const yr = new Date().getFullYear();
    const key = `${prefix}-${yr}`;
    let c = await Store.get('counters', key);
    if(!c){ c = { id:key, n:0 }; }
    c.n += 1;
    await Store.put('counters', c);
    return `${prefix}-${yr}-${String(c.n).padStart(3,'0')}`;
  }
  // coordinate parsing: decimal, DMS, or google maps URL
  function parseCoords(raw){
    if(!raw) return null;
    let s = String(raw).trim();
    // google maps url with @lat,lon or q=lat,lon or !3dlat!4dlon
    let m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
    if(m) return valid(parseFloat(m[1]), parseFloat(m[2]));
    // DMS e.g. 33°52'07.7"S 151°12'33.5"E
    const dms = s.match(/(\d+)[°\s]+(\d+)['\s]+([\d.]+)"?\s*([NSEW]).*?(\d+)[°\s]+(\d+)['\s]+([\d.]+)"?\s*([NSEW])/i);
    if(dms){
      const conv=(d,mi,se,h)=>{ let v=(+d)+(+mi)/60+(+se)/3600; if(/[SW]/i.test(h))v=-v; return v; };
      let a=conv(dms[1],dms[2],dms[3],dms[4]), b=conv(dms[5],dms[6],dms[7],dms[8]);
      // order to lat,lon by hemisphere letter
      let lat=/[NS]/i.test(dms[4])?a:b, lon=/[EW]/i.test(dms[4])?a:b;
      return valid(lat,lon);
    }
    // plain "-33.8688, 151.2093"
    m = s.match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
    if(m) return valid(parseFloat(m[1]), parseFloat(m[2]));
    return null;
    function valid(lat,lon){ if(isNaN(lat)||isNaN(lon)) return null; return {lat,lon}; }
  }
  const inAustralia = c => c && c.lat>=-44 && c.lat<=-9 && c.lon>=112 && c.lon<=154;
  function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
  return { uid, nowISO, fmt, fmtDate, todayStr, daysBetween, daysUntil, addDays, addMonths, esc, seqId, parseCoords, inAustralia, debounce, MON };
})();

async function saveEntity(storeName, stateKey, obj){
  obj.updatedAt = U.nowISO();
  if(!obj.createdAt) obj.createdAt = obj.updatedAt;
  await Store.put(storeName, obj);
  const arr = State[stateKey];
  const i = arr.findIndex(x=>x.id===obj.id);

}

/* ---------------------------------------------------------------- *
 *  4. ALERT ENGINE — single source for BLOCKER/WARNING/INFO
 * ---------------------------------------------------------------- */
const Alerts = (function(){
  // Create or update an alert keyed by (ruleKey + entity) so we don't duplicate.
  async function raise({severity, message, why, fix, entityType, entityId, ruleKey, dismissible, helpTopic}){
    const key = ruleKey || (severity+':'+message+':'+entityType+':'+entityId);
    let a = State.alerts.find(x=>x.ruleKey===key && !x.resolvedAt);
    if(a){ a.severity=severity; a.message=message; a.why=why; a.fix=fix; if(helpTopic) a.helpTopic=helpTopic; await Store.put('alerts',a); return a; }
    a = { id:U.uid(), ruleKey:key, severity, message, why:why||'', fix:fix||'', helpTopic:helpTopic||null,
          entityType, entityId, dismissible: dismissible!==false && severity!=='blocker',
          createdAt:U.nowISO(), resolvedAt:null };
    await Store.put('alerts', a); State.alerts.push(a);
    return a;
  }
  async function resolve(ruleKey, note){
    const a = State.alerts.find(x=>x.ruleKey===ruleKey && !x.resolvedAt);
    if(!a) return;
    a.resolvedAt = U.nowISO(); a.resolvedBy = App.currentActor||'System'; a.resolutionNote = note||'Auto-resolved';
    await Store.put('alerts', a);
  }
  async function dismiss(id, reason){
    const a = State.alerts.find(x=>x.id===id); if(!a || a.severity==='blocker') return false;
    a.dismissedInfo = { by:App.currentActor||'System', reason:reason||'', at:U.nowISO() };
    a.resolvedAt = U.nowISO(); a.resolvedBy = App.currentActor||'System'; a.resolutionNote = 'Dismissed: '+(reason||'');
    await Store.put('alerts', a);
    await audit('dismiss-alert','alert',a.id,reason||'');
    return true;
  }
  const open = ()=> State.alerts.filter(a=>!a.resolvedAt);
  const openFor = (type,id)=> open().filter(a=>a.entityType===type && a.entityId===id);
  const blockersFor = (type,id)=> openFor(type,id).filter(a=>a.severity==='blocker');
  const bySeverity = sev => open().filter(a=>a.severity===sev);
  return { raise, resolve, dismiss, open, openFor, blockersFor, bySeverity };
})();

// Create a change event (auto or manual). Significant events gate their trigger entity.
async function createChangeEvent({classification, triggerType, triggerRef, description}){
  const id = await U.seqId('CHG');
  const now = U.nowISO();
  const ev = {
    id, classification, triggerType, triggerRef: triggerRef||null, description,
    identifiedAt: now,
    deadline: classification==='NONSIG' ? U.addDays(now,21) : null,
    status: 'Identified',
    casa: {},
    history: [{ at:now, note:'Event identified: '+description, by:App.currentActor||'System' }],
    createdAt: now, updatedAt: now, createdBy: App.currentActor||'System'
  };
  await saveEntity('changeEvents','changeEvents',ev);
  await audit('create','changeEvent',id, classification+': '+description);
  await logOpsManualEntry('Procedures', (classification==='SIG'?'Significant':'Non-significant')+' change identified — '+id, description, id);
  // seed alert
  if(classification==='SIG'){
    await Alerts.raise({ severity:'blocker', message:'Do not implement: '+description+' awaits CASA approval',
      why:'Significant changes require CASA approval before they take effect.', fix:'Record CASA approval on change event '+id+'.',
      entityType:'changeEvent', entityId:id, ruleKey:'chg-sig:'+id });
  }else{
    await Alerts.raise({ severity:'info', message:'Notify CASA within 21 days: '+description,
      why:'Non-significant changes must be notified to CASA via myCASA within 21 days.', fix:'Record the myCASA notification on change event '+id+'.',
      entityType:'changeEvent', entityId:id, ruleKey:'chg-nonsig:'+id, dismissible:false });
  }
  return ev;
}

const Modal = {
  open({title, body, footer, wide, onMount}){
    const back = h(`<div class="modal-back"><div class="modal ${wide?'wide':''}">
      <div class="modal-head"><h3>${U.esc(title)}</h3><button class="x" aria-label="Close">&times;</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot"></div></div></div>`);
    $('.modal-body',back).innerHTML = body||'';
    if(footer){ $('.modal-foot',back).innerHTML = footer; } else { $('.modal-foot',back).remove(); }
    $('.x',back).onclick = ()=> Modal.close(back);
    back.addEventListener('mousedown', e=>{ if(e.target===back) Modal.close(back); });
    App.el('modalRoot').appendChild(back);
    if(onMount) onMount(back);
    return back;
  },
  close(back){ if(back&&back.parentNode) back.remove(); else App.el('modalRoot').innerHTML=''; },
  closeAll(){ App.el('modalRoot').innerHTML=''; }
};
// confirmation dialog -> Promise<bool>
function confirmDialog({title, message, confirmLabel, danger, requireReason}){
  return new Promise(resolve=>{
    const reasonHtml = requireReason ? `<div class="field" style="margin-top:10px"><label class="req">Reason</label><textarea id="cfReason" placeholder="Record the reason…"></textarea></div>` : '';
    const back = Modal.open({
      title, body:`<p>${U.esc(message)}</p>${reasonHtml}`,
      footer:`<button class="btn ghost" id="cfNo">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="cfYes">${U.esc(confirmLabel||'Confirm')}</button>`
    });
    $('#cfNo',back).onclick=()=>{ Modal.close(back); resolve(false); };
    $('#cfYes',back).onclick=()=>{
      if(requireReason){ const r=$('#cfReason',back).value.trim(); if(!r){ toast('A reason is required','err'); return; } Modal.close(back); resolve(r); }
      else { Modal.close(back); resolve(true); }
    };
  });
}

// Per-nav-item badge count: Dashboard shows the urgent (blocker) count in red;
// other sections show their own open WARNING count in amber (blockers already
// surface via Dashboard, so we don't double-count them on every item).
function navBadgeFor(id){
  const open = Alerts.open();
  if(id==='dashboard'){
    const b=open.filter(a=>a.severity==='blocker').length;
    if(b) return {n:b,cls:''};
    const w=open.filter(a=>a.severity==='warning').length;
    return w? {n:w,cls:'warn'} : null;
  }
  const typeMap = {fleet:['drone','battery'], personnel:['person'], changes:['changeEvent']};
  const types = typeMap[id]; if(!types) return null;
  const n = open.filter(a=>a.severity==='warning' && types.includes(a.entityType)).length;
  return n? {n,cls:'warn'} : null;
}
function renderNav(){

/* ---------------------------------------------------------------- *
 *  7. RECOMPUTE — evaluate standing compliance rules into alerts
 *     Called on load and after every mutation.
 * ---------------------------------------------------------------- */
async function recompute(){
  const today = U.nowISO();
  // --- Drone registration expiry & overdue maintenance ---
  for(const d of State.drones){
    if(d.status==='Retired-Sold-Written off') continue;
    // registration expiry
    if(d.regExpiry){
      const dleft = U.daysUntil(d.regExpiry);
      if(dleft!=null && dleft<0){
        await Alerts.raise({severity:'blocker', message:`${d.nickname}: CASA registration expired`,
          why:'An aircraft with expired CASA registration must not be flown (B6).', fix:`Renew registration for ${d.nickname} in Fleet.`,
          entityType:'drone', entityId:d.id, ruleKey:'rego-exp:'+d.id});
      } else if(dleft!=null && dleft<=30){
        await Alerts.raise({severity:'warning', message:`${d.nickname}: registration expires in ${dleft} day(s)`,
          why:'CASA registration must remain current for the aircraft to be assignable.', fix:`Renew registration for ${d.nickname}.`,
          entityType:'drone', entityId:d.id, ruleKey:'rego-warn:'+d.id});
      } else { await Alerts.resolve('rego-exp:'+d.id); await Alerts.resolve('rego-warn:'+d.id); }
    }
    // maintenance schedules
    for(const sc of State.maintSchedules.filter(s=>s.droneId===d.id)){
      const st = scheduleStatus(sc, d);
      const rk = 'maint:'+sc.id;
      if(st.level==='overdue'){
        await Alerts.raise({severity:'blocker', message:`${d.nickname}: "${sc.itemName}" maintenance overdue`,
          why:'A drone with overdue scheduled maintenance cannot be assigned to a flight (B6).', fix:`Complete "${sc.itemName}" in Fleet ▸ Maintenance.`,
          entityType:'drone', entityId:d.id, ruleKey:rk});
      } else if(st.level==='warn'){
        await Alerts.raise({severity:'warning', message:`${d.nickname}: "${sc.itemName}" due — ${st.msg}`,
          why:'Scheduled maintenance is approaching its interval.', fix:`Schedule "${sc.itemName}" soon.`,
          entityType:'drone', entityId:d.id, ruleKey:rk});
      } else if(st.level==='info'){
        await Alerts.raise({severity:'info', message:`${d.nickname}: "${sc.itemName}" approaching (${st.msg})`,
          why:'Scheduled maintenance at 75% of its interval.', fix:'', entityType:'drone', entityId:d.id, ruleKey:rk});
      } else { await Alerts.resolve(rk); }
    }
  }
  // --- Battery cycle limits ---
  for(const b of State.batteries){
    if(b.status==='Retired') continue;
    const pct = b.cycleLimit ? b.cycles/b.cycleLimit : 0;
    const rk='bat:'+b.id;
    if(pct>=1){ await Alerts.raise({severity:'blocker', message:`Battery ${b.label} at cycle limit — retire`,
      why:'A battery at its cycle limit must be retired and cannot be used in flight (B12).', fix:`Retire ${b.label} in Fleet ▸ Batteries.`,
      entityType:'battery', entityId:b.id, ruleKey:rk}); }
    else if(pct>=0.8){ await Alerts.raise({severity:'warning', message:`Battery ${b.label} at ${Math.round(pct*100)}% of cycle limit`,
      why:'Battery approaching end of service life.', fix:`Plan replacement of ${b.label}.`, entityType:'battery', entityId:b.id, ruleKey:rk}); }
    else await Alerts.resolve(rk);
  }
  // --- Pilot recency ---
  const recDays = (State.settings&&State.settings.recencyDays)||90;
  for(const p of State.people.filter(p=>p.status==='Active' && (p.roles||[]).some(r=>/Pilot/i.test(r)))){
    const rk='recency:'+p.id;
    const overridden = p.recencyOverride && p.recencyOverride.date && U.daysUntil(U.addDays(p.recencyOverride.date, recDays))>=0;
    const daysSince = p.lastFlightAt? U.daysBetween(p.lastFlightAt, today) : 9999;
    if(daysSince>recDays && !overridden){
      await Alerts.raise({severity:'warning', message:`${p.name}: pilot recency lapsed (${daysSince===9999?'no logged flights':daysSince+' days'})`,
        why:`Our ops manual requires a logged flight within ${recDays} days to remain current as PIC (B8).`, fix:`Record a recency/check-flight note for ${p.name} in Personnel.`,
        entityType:'person', entityId:p.id, ruleKey:rk});
    } else await Alerts.resolve(rk);
  }
  // --- Change event deadlines ---
  for(const ev of State.changeEvents){
    if(ev.classification==='NONSIG' && ev.status!=='Notified'){
      const dleft = U.daysUntil(ev.deadline);
      const rk='chg-nonsig:'+ev.id;
      if(dleft!=null && dleft<0){
        await Alerts.raise({severity:'blocker', message:`CASA notification OVERDUE — ${ev.description}`,
          why:'A non-significant change not notified within 21 days is a compliance breach (B18).', fix:`Record the myCASA notification on ${ev.id}.`,
          entityType:'changeEvent', entityId:ev.id, ruleKey:rk, dismissible:false});
      } else if(dleft!=null && dleft<=7){
        await Alerts.raise({severity:'warning', message:`Notify CASA: ${dleft} day(s) left — ${ev.description}`,
          why:'Non-significant change nearing its 21-day notification deadline.', fix:`Notify via myCASA and record on ${ev.id}.`,
          entityType:'changeEvent', entityId:ev.id, ruleKey:rk, dismissible:false});
      }
    }
    if(ev.classification==='SIG' && !(ev.casa&&ev.casa.decision==='Approved')){
      // keep the do-not-implement blocker alive
      await Alerts.raise({severity:'blocker', message:'Do not implement: '+ev.description+' awaits CASA approval',
        why:'Significant changes require CASA approval before taking effect (B17).', fix:`Record CASA approval on ${ev.id}.`,
        entityType:'changeEvent', entityId:ev.id, ruleKey:'chg-sig:'+ev.id, dismissible:false});
    }
  }
  renderNav();
  updateBackupBanner();
}

/* Maintenance schedule status calc (hours + calendar, whichever first) */
function scheduleStatus(sc, drone){
  const hoursUsed = sc.intervalHours ? (drone.totalHours - (sc.lastDoneHours||0)) : null;
  const hoursPct = sc.intervalHours ? hoursUsed/sc.intervalHours : 0;
  let monthsPct=0, daysLeft=null;
  if(sc.intervalMonths){
    const base = sc.lastDoneAt || drone.addedAt || U.nowISO();
    const due = U.addMonths(base, sc.intervalMonths);
    daysLeft = U.daysUntil(due);
    const totalDays = sc.intervalMonths*30.4;
    monthsPct = (totalDays - (daysLeft==null?0:daysLeft))/totalDays;
  }
  const pct = Math.max(hoursPct, monthsPct);
  let level='ok', msg='';
  const hoursOver = sc.intervalHours && hoursUsed>=sc.intervalHours;
  const calOver = sc.intervalMonths && daysLeft!=null && daysLeft<0;
  if(hoursOver||calOver){ level='overdue'; msg='overdue'; }
  else if(pct>=0.9 || (daysLeft!=null && daysLeft<=14)){ level='warn'; msg = daysLeft!=null? `${daysLeft} day(s)`:`${Math.round((sc.intervalHours-hoursUsed)*10)/10} hr left`; }
  else if(pct>=0.75){ level='info'; msg = `${Math.round(pct*100)}%`; }
  return { level, msg, pct, daysLeft, hoursUsed };
}

/* Drone assignability (B6/B7) — returns {ok, reasons[]} */
function droneAssignable(drone){
  const reasons=[];
  if(!drone) return {ok:false, reasons:['No drone selected']};
  if(drone.status==='Retired-Sold-Written off') reasons.push('Aircraft is retired/sold/written off');
  if(drone.status==='In maintenance') reasons.push('Aircraft is in maintenance (unavailable)');
  if(drone.status==='Pending CASA approval') reasons.push('Aircraft type pending CASA approval — NOT flyable (B7)');
  if(drone.regExpiry && U.daysUntil(drone.regExpiry)<0) reasons.push('CASA registration expired');
  // overdue maintenance
  for(const sc of State.maintSchedules.filter(s=>s.droneId===drone.id)){
    if(scheduleStatus(sc,drone).level==='overdue') reasons.push('Overdue maintenance: '+sc.itemName);
  }
  // grounding defect
  if(State.maintIssues.some(i=>i.droneId===drone.id && i.severity==='Grounding' && i.status==='Open'))
    reasons.push('Open grounding defect');
  return { ok:reasons.length===0, reasons };
}
function pilotAssignable(person){
  const reasons=[];
  if(!person) return {ok:false, reasons:['No pilot selected']};
  if(person.status!=='Active') reasons.push('Pilot is inactive');
  if(!person.replNumber) reasons.push('RePL number missing');
  const recDays = (State.settings&&State.settings.recencyDays)||90;
  const overridden = person.recencyOverride && person.recencyOverride.date && U.daysUntil(U.addDays(person.recencyOverride.date, recDays))>=0;
  const daysSince = person.lastFlightAt? U.daysBetween(person.lastFlightAt, U.nowISO()) : 9999;
  if(daysSince>recDays && !overridden) reasons.push('Recency lapsed — no override recorded (B8)');
  return { ok:reasons.length===0, reasons };
}

/* Backup banner (14-day reminder) */
let backupBannerDismissed = false;
function updateBackupBanner(){
  const b = App.el('backupBanner');
  const last = State.settings && State.settings.lastBackupAt;
  const days = last ? U.daysBetween(last, U.nowISO()) : 9999;
  if(!backupBannerDismissed && days>14){
    App.el('backupMsg').textContent = last
      ? `No backup exported in ${days} days. Export a backup to protect your flight records.`
      : `No backup has ever been exported. Export a backup to protect your flight records.`;
    b.classList.add('show');
  } else b.classList.remove('show');
}
function dismissBackupBanner(){ backupBannerDismissed = true; App.el('backupBanner').classList.remove('show'); }

/* Shared: render an alert row with resolve/dismiss + link to source */
function alertRow(a){
  const icon = a.severity==='blocker'?'🔴':a.severity==='warning'?'🟠':'🔵';
  const link = alertLink(a);
  const topic = a.helpTopic || guessTopic(a);
  const actions = [];
  if(link) actions.push(`<button class="btn sm ghost" onclick="${link}">Open</button>`);
  if(topic) actions.push(`<button class="btn sm ghost" onclick="Guides.show('${topic}')">ⓘ Guide</button>`);
  if(a.dismissible) actions.push(`<button class="btn sm ghost" onclick="dismissAlertPrompt('${a.id}')">Dismiss</button>`);
  return `<div class="alert ${a.severity}">
    <span class="ai">${icon}</span>
    <div class="abody">
      <div class="atitle">${U.esc(a.message)}</div>
      ${a.why?`<div class="awhy">${U.esc(a.why)}</div>`:''}
      ${a.fix?`<div class="afix">➡ ${U.esc(a.fix)}</div>`:''}
      ${actions.length?`<div class="alert-actions">${actions.join('')}</div>`:''}
    </div></div>`;
}
function alertLink(a){
  switch(a.entityType){
    case 'flight': return `openFlight('${a.entityId}')`;
    case 'drone': return `nav('fleet')`;
    case 'battery': return `nav('fleet')`;
    case 'person': return `nav('personnel')`;
    case 'changeEvent': return `openChange('${a.entityId}')`;
    default: return null;
  }
}
async function dismissAlertPrompt(id){
  const reason = await confirmDialog({title:'Dismiss alert', message:'Recording a reason keeps the audit trail complete. This alert will move to Alert History.', confirmLabel:'Dismiss', requireReason:true});
  if(reason){ await Alerts.dismiss(id, reason); await recompute(); nav(App.route); toast('Alert dismissed'); }
}
// Infer a help topic from an alert's wording (so existing alerts get guides without re-seeding)
function guessTopic(a){
  const s = (a.message+' '+(a.why||'')).toLowerCase();
  if(/registration/.test(s)) return 'drone-registration';
  if(/recency|repl|pilot/.test(s)) return 'pilot-recency';
  if(/maintenance|defect|grounding|schedule/.test(s)) return 'maintenance';
  if(/battery|cycle|swelling/.test(s)) return 'battery';
  if(/atsb|occurrence|incident/.test(s)) return 'atsb';
  if(/casa|notify|significant|change|schedule 1|approval/.test(s)) return 'change-events';
  return null;
}

/* ---- Action-queue helpers: map an Alert to an ops-manual tag + a real action ---- */
function alertCode(a){
  const rk = a.ruleKey||'';
  if(rk.startsWith('rego-')) return 'B6';
  if(rk.startsWith('maint:')) return 'B6';
  if(rk.startsWith('issue:')) return a.severity==='blocker' ? 'B6' : 'B13';
  if(rk.startsWith('bat:')||rk.startsWith('batpost:')) return 'B12';
  if(rk.startsWith('recency:')) return 'B8';
  if(rk.startsWith('chg-sig:')) return 'B17';
  if(rk.startsWith('chg-nonsig:')) return 'B18';
  if(rk.startsWith('atsb:')) return 'B15';
  return '';
}
function alertPrimaryAction(a){
  const rk = a.ruleKey||'';
  if(rk.startsWith('rego-')) return {label:'Renew', onclick:`Fleet.editDrone('${a.entityId}')`};
  if(rk.startsWith('issue:')){
    const issueId = rk.slice(rk.indexOf(':')+1);
    if(a.severity==='blocker') return {label:'Open defect', onclick:`Dashboard.openIssue('${issueId}')`};
    return null;
  }
  if(rk.startsWith('maint:')) return {label:'Open maintenance', onclick:`Fleet.tab='maintenance';nav('fleet')`};
  if(rk.startsWith('bat:')||rk.startsWith('batpost:')) return {label:'Open battery', onclick:`Fleet.tab='batteries';nav('fleet')`};
  if(rk.startsWith('recency:')) return {label:'Record recency', onclick:`People.recency('${a.entityId}')`};
  if(rk.startsWith('chg-')) return {label:'Open', onclick:`openChange('${a.entityId}')`};
  if(rk.startsWith('atsb:')) return {label:'Open flight', onclick:`openFlight('${a.entityId}')`};
  const link = alertLink(a);
  return link? {label:'Open', onclick:link} : null;
}
// For a defect-raised alert, look up the underlying MaintIssue so the card

}

Views.dashboard = function(){

        ${aqSection('warning','Review before flight', reviewWarnings.length, reviewWarnings.map(aqCard).join(''))}
        ${currencyWarnings.length? `<div class="aq-section">
          <div class="aq-section-head"><span class="dot warning"></span><h3>Pilot currency lapsed</h3>
            <span class="cnt warning">${currencyWarnings.length}</span><span class="rule"></span></div>
          <div class="aq-currency">

              <div class="aq-meta"><span class="aq-tag">OPS MANUAL B8</span><span class="aq-fix">A logged flight within ${recDays} days is required to remain current as PIC</span></div></div>
              <button class="btn aq-ghost" onclick="nav('personnel')" style="white-space:nowrap">Schedule check flights</button></div>
            <div class="aq-cur-row head"><span>PILOT</span><span style="text-align:right">DAYS SINCE</span><span></span></div>
            ${currencyWarnings.map(x=>`<div class="aq-cur-row"><span>${U.esc(x.p.name)}</span><span class="days">${x.ds===9999?'—':x.ds}</span>
              <a href="#" onclick="event.preventDefault();People.recency('${x.p.id}')">Record recency</a></div>`).join('')}

            <span class="lbl2">Maintenance due, 30 days</span><span class="val ${maintOverdue?'due':''}" onclick="nav('fleet')" style="cursor:pointer">${maintDue.length? maintDue.length+' item'+(maintDue.length===1?'':'s') : 'None'}</span></div>

          <div class="lbl">YEAR TO DATE</div>
          <div class="aq-ytd-grid">
            <div><div class="n">${completedYTD}</div><div class="l">Completed flights</div></div>
            <div><div class="n">${fleetHours.toFixed(1)}</div><div class="l">Total fleet hours</div></div>

/* ================================================================ *
 *  ACCESS GATE (soft, client-side) — keeps casual visitors out.
 *  NOT true security: the page & Supabase key are public. For real
 *  protection use Supabase Auth. Password is stored hashed, not plain.
 * ================================================================ */
const AUTH_HASH = '0b68a644fd1fd32601b827d4b5b1f69848773e76de4dbe87a42ab870a9ea4710';
function isAuthed(){ return localStorage.getItem('reoc_authed')==='1'; }
async function sha256hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
// Shared: hide the authenticated-app shell (sidebar/topbar/backup banner/
// chat assistant) for any pre-auth or not-yet-configured screen.
function hideAppShell(){
  App.el('sidebar').style.display='none';
  const tb=document.querySelector('.topbar'); if(tb) tb.style.display='none';
  App.el('backupBanner').classList.remove('show');

}
function showLogin(){
  hideAppShell();
  App.set(`<div style="max-width:380px;margin:8vh auto 0">
    <div class="card" style="text-align:center">
      <div style="font-size:2.2rem">🔒</div>
      <h1 style="margin:8px 0 2px">ReOC Flight Operations</h1>
      <p class="muted" style="margin-bottom:16px">Enter the access password to continue.</p>
      <div class="field" style="text-align:left"><label class="req">Password</label>
        <input type="password" id="loginPw" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div id="loginErr" style="color:var(--blocker);font-size:.82rem;min-height:18px;margin-bottom:6px"></div>
      <button class="btn primary lg" onclick="doLogin()">Sign in</button>
    </div></div>`);
  setTimeout(()=>{ const el=App.el('loginPw'); if(el) el.focus(); }, 60);
}
async function doLogin(){
  const pw = App.el('loginPw').value;
  const err = App.el('loginErr');
  if(!pw){ err.textContent='Enter the password.'; return; }
  const h = await sha256hex(pw);
  if(h===AUTH_HASH){
    localStorage.setItem('reoc_authed','1');
    App.el('sidebar').style.display='';
    const tb=document.querySelector('.topbar'); if(tb) tb.style.display='';
    init();
  } else { err.textContent='Incorrect password.'; App.el('loginPw').value=''; App.el('loginPw').focus(); }
}
function logout(){ localStorage.removeItem('reoc_authed'); location.reload(); }

/* ================================================================ *
 *  INIT + FIRST-LAUNCH SETUP WIZARD
 * ================================================================ */
async function init(){
  if(!isAuthed()){ return showLogin(); }
  await Store.open();
  await State.loadAll();
  if(!State.settings){
    // Empty local data. Only offer first-time setup if the cloud is actually
    // reachable and genuinely empty. If the cloud can't be reached (e.g. env
    // vars not set on this deployment), show a connection screen instead of
    // wrongly re-running setup for an already-configured organisation.
    if(Store.isRemote()) return setupWizard();
    return showConnError();
  }
  // Defensive: showLogin/showConnError/setupWizard hide the shell while
  // pre-auth; make sure a normal boot always restores it.
  App.el('sidebar').style.display=''; const tbEl=document.querySelector('.topbar'); if(tbEl) tbEl.style.display='';
  App.el('chatBubble').classList.add('show');
  setOrgBrand(State.settings.orgName, State.settings.reocNumber);
  renderNav();
  await recompute();
  nav('dashboard');
}

function gmapEmbed(lat,lon){
  const d=0.008, bbox=`${lon-d},${lat-d},${lon+d},${lat+d}`;
  return `<iframe title="Location map" width="100%" height="220" style="border:0;border-radius:8px" loading="lazy"
     src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat},${lon}"></iframe>
   <div class="hint" style="margin-top:4px">Map preview (OpenStreetMap). Use “Open in Google Maps” above for the Google view, then attach a screenshot.</div>`;
}
// Downscale + compress an image File to a JPEG data URL (keeps records small enough to sync in-row)
function resizeImage(file, maxDim, quality){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url);
      let {width:w,height:h}=img; if(w>maxDim||h>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}

/* ---- Flight file shell + stepper ---- */
function renderFlightFile(){
  const f = CUR; if(!f){ nav('flights'); return; }
  const readonly = f.status==='COMPLETED';
  const cancelled = f.status==='CANCELLED';
  const curIdx = FLIGHT_STEPS.indexOf(f.status);
  const stepper = FLIGHT_STEPS.map((s,i)=>{
    let cls = i<curIdx?'done': i===curIdx?'current':'';
    if((cancelled||f.status==='ABORTED') && i>curIdx) cls='';
    return `<div class="step ${cls}"><span class="num">${i<curIdx?'✓':i+1}</span>${STEP_SHORT[s]}</div>`;
  }).join('');
  const d=State.drone(f.droneId), p=State.person(f.pilotId);
  let stageHtml='';
  switch(f.status){
    case 'PLANNING': stageHtml = planningStage(f); break;
    case 'APPROVED': stageHtml = approvedStage(f); break;
    case 'PRE-FLIGHT IN PROGRESS': stageHtml = preflightStage(f); break;
    case 'FLYING': stageHtml = flyingStage(f); break;
    case 'POST-FLIGHT IN PROGRESS': stageHtml = postflightStage(f); break;
    case 'SUBMITTED FOR APPROVAL': stageHtml = submittedStage(f); break;
    case 'COMPLETED': stageHtml = completedStage(f); break;
    case 'CANCELLED': case 'ABORTED': stageHtml = closedStage(f); break;
    default: stageHtml = planningStage(f);
  }
  const canCancel = ['DRAFT','PLANNING','APPROVED','PRE-FLIGHT IN PROGRESS'].includes(f.status);
  App.set(`
    <div class="page-head no-print"><div class="grow">
      <button class="btn sm ghost" onclick="nav('flights')">← All flights</button>
      <h1 style="margin-top:8px">${f.id} <span style="font-weight:400;font-size:1rem" class="muted">· ${U.esc(f.locationName)}</span></h1>
      <div class="page-sub">${statusPill(f.status)} · ⛊ ${d?U.esc(d.nickname):'—'} · ☺ ${p?U.esc(p.name):'—'} · 📅 ${U.fmtDate(f.plannedDate)}</div>
    </div>
    <div class="btn-row">
      <button class="btn sm" onclick="printFlight('${f.id}')">🖨 Print / Export PDF</button>
      ${canCancel?`<button class="btn sm danger" onclick="Flights.cancel('${f.id}')">Cancel flight</button>`:''}
      ${readonly?`<button class="btn sm" onclick="Flights.amend('${f.id}')">Amend</button>`:''}
    </div></div>
    <div class="card no-print"><div class="stepper">${stepper}</div></div>
    ${flightAlertStrip(f)}
    ${stageHtml}
    ${flightLogHtml(f)}
  `);
}
/* On-screen pre-flight / post-flight log — same data as the print export,
   but readable in-app without printing. Shows once each phase is done. */
function flightLogHtml(f){
  if(!f.preOp.done && !f.postFlight.done) return '';
  const it=n=>f.preOp.items[n]||{}; const pit=n=>f.postOp.items[n]||{};
  const w=f.preOp.weather||{};
  const row=(on,label,val,at,note)=>`<div class="kv"><span class="k">${on?'✓':'—'} ${U.esc(label)}</span>
    <span class="v" style="font-weight:400;text-align:right">${val?U.esc(val):''}${at?` <span class="hint mono">${U.fmt(at)}</span>`:''}${note?`<div class="hint">${U.esc(note)}</div>`:''}</span></div>`;
  const defectsFor=(sortieCtx)=>State.maintIssues.filter(i=>i.flightId===f.id).map(i=>
    `<div class="alert ${i.severity==='Grounding'?'blocker':'warning'}" style="margin-top:8px"><span class="ai">${i.severity==='Grounding'?'🔴':'🟠'}</span>
      <div class="abody"><div class="atitle">${U.esc(i.id)}: ${U.esc(i.description)}</div>
      <div class="awhy">Raised by ${U.esc(i.raisedBy)} · ${U.fmt(i.raisedAt)} · ${U.esc(i.status)}${i.rectification?` · rectified by ${U.esc(i.rectification.by)} · ${U.fmt(i.rectification.date)}`:''}</div></div></div>`).join('');

  let preHtml='';
  if(f.preOp.done){
    preHtml = `<details class="card no-print" open><summary class="section-title" style="cursor:pointer">Pre-flight log ▾</summary>
      <div class="section-title" style="margin-top:10px">Pre-operation checklist</div>
      ${row(it(1).ticked,'1. Job number confirmed',f.jobNumber,it(1).at)}
      ${row(it(2).ticked,'2. JSA read & understood',null,it(2).at)}
      ${row((f.crew||[]).length>=2,'3. Crew roles assigned',(f.crew||[]).length+' crew')}
      ${row(it(4).ticked,'4. Weather within limits',`wind ${w.windKt??'—'}kt, gust ${w.gustKt??'—'}kt, ${w.precip||'—'}, ${w.temp??'—'}°C`,it(4).at)}
      ${row(it(5).ticked,'5. Crew huddle / briefing',null,it(5).at)}
      ${row(it(6).ticked,'6. Alternate LZ confirmed on site',null,it(6).at)}
      ${row(it(7).value&&it(7).value!=='High','7. Public interference re-assessed',it(7).value,null,it(7).note)}
      ${row(it(8).ticked,'8. Aeronautical maps reviewed',null,it(8).at)}
      ${row(it(9).ticked,'9. Obstacles confirmed',(f.preOp.tallestConfirm??f.planning.site.tallestObstacleM)+' m',it(9).at)}
      ${row(batteriesOk(f),'10. Batteries >90%',(f.preOp.batteries||[]).map(b=>{const bb=State.battery(b.batteryId);return (bb?bb.label:b.batteryId)+' '+b.pct+'%';}).join(', '))}
      ${row(it(11).ticked,'11. Media storage OK',null,it(11).at)}
      ${row(it(12).ticked,'12. Camera settings configured',null,it(12).at,it(12).note)}
      ${it(13).note?row(true,'13. Field notes',null,null,it(13).note):''}
      ${row(true,'14. Completed by',f.preOp.sig?f.preOp.sig.by+' ('+f.preOp.sig.initials+')':'—',f.preOp.sig&&f.preOp.sig.at)}
      ${f.sorties.map(sr=>`<div class="section-title" style="margin-top:14px">Sortie ${sr.n} — pre-flight procedure</div>
        ${PREFLIGHT_STEPS.map(st=>row(sr.preFlightSteps[st.n]&&sr.preFlightSteps[st.n].ticked, st.n+'. '+st.label, null, sr.preFlightSteps[st.n]&&sr.preFlightSteps[st.n].at)).join('')}
        <div class="kv"><span class="k">Battery / takeoff</span><span class="v" style="font-weight:400;text-align:right">${(sr.batteryIds||[]).map(b=>{const bb=State.battery(b);return bb?bb.label:b;}).join(', ')||'—'} · ${U.fmt(sr.takeoffAt)}${sr.aborted?` · <b style="color:var(--blocker)">ABORTED: ${U.esc(sr.aborted.reason)}</b>`:''}</span></div>`).join('')}
    </details>`;
  }
  let postHtml='';
  if(f.postFlight.done){
    const totalMin=f.postFlight.totalMin||f.sorties.reduce((a,x)=>a+(x.durationMin||0),0);
    postHtml = `<details class="card no-print" open><summary class="section-title" style="cursor:pointer">Post-flight log ▾</summary>
      <div class="section-title" style="margin-top:10px">Post-flight procedure</div>
      ${POSTFLIGHT_STEPS.map(st=>row(f.postFlight.steps[st.n]&&f.postFlight.steps[st.n].ticked, st.n+'. '+st.label, null, f.postFlight.steps[st.n]&&f.postFlight.steps[st.n].at)).join('')}
      ${defectsFor()}
      <div class="section-title" style="margin-top:14px">Post-operation checklist</div>
      ${row(pit(1).ticked,'1. Drone flown confirmed',State.drone(f.droneId)?State.drone(f.droneId).model:'')}

      ${row(pit(3).ticked,'3. Spotters confirmed')}
      ${row(true,'4. Total flight hours',(totalMin/60).toFixed(2)+' h')}
      ${row(batPostOk(f),'5. Battery post-flight state recorded')}
      ${row(pit(6).ticked,'6. Media offloaded & backed up')}
      ${row(!!pit(7).value,'7. Maintenance issues arising',pit(7).value)}
      ${row(!!pit(8).value,'8. Incidents / occurrences',pit(8).value)}
      ${pit(9).note?row(true,'9. Notes / lessons',null,null,pit(9).note):''}
      ${row(true,'10. Completed by',f.submission?f.submission.by+' ('+f.submission.initials+')':'—',f.submission&&f.submission.at)}

    </details>`;
  }
  return preHtml+postHtml;
}

/* Save current flight (immutable guard) */
async function saveFlight(f, action, detail){
  if(f.status==='COMPLETED'){ toast('Completed flight is read-only','err'); return; }
  await saveEntity('flights','flights',f);
  if(action) await audit(action,'flight',f.id,detail||'');
}

/* ---- PLANNING STAGE ---- */
const AIRSPACE_OPTS = ['','Clear — no restrictions','Approval required','No-fly'];

  const a = f.planning[appKey]||{};

  return `<div class="field">
    <label class="req">${appName} result</label>
    <select onchange="Flights.setAir('${appKey}','result',this.value)">
      ${AIRSPACE_OPTS.map(o=>`<option value="${o}" ${a.result===o?'selected':''}>${o||'Select…'}</option>`).join('')}
    </select>
    <div class="field" style="margin-top:8px"><label>Notes</label><input value="${U.esc(a.notes||'')}" onchange="Flights.setAir('${appKey}','notes',this.value)"></div>
    <label class="tick ${a.screenshot?'on':''}" onclick="Flights.toggleAir('${appKey}','screenshot')"><span class="box">✓</span><span class="txt">Screenshot saved to job folder</span></label>
    <div class="btn-row" style="margin-top:6px"><label class="btn sm">📷 Attach ${appName} screenshot<input type="file" accept="image/*" style="display:none" onchange="Flights.setAirShot('${appKey}',this)"></label>${a.screenshotImg?`<button class="btn sm ghost" onclick="Flights.clearAirShot('${appKey}')">Remove</button>`:''}</div>

      <div class="section-title">Approval obtained — sub-record</div>
      <div class="inline"><div class="field"><label class="req">Approval reference #</label><input value="${U.esc(appr.ref||'')}" onchange="Flights.setApproval('${appKey}','ref',this.value)"></div>
        <div class="field"><label class="req">Issuing authority</label><input value="${U.esc(appr.authority||'')}" onchange="Flights.setApproval('${appKey}','authority',this.value)"></div></div>
      <div class="inline"><div class="field"><label class="req">Approval date</label><input type="date" value="${U.esc(appr.date||'')}" onchange="Flights.setApproval('${appKey}','date',this.value)"></div>

function scopeToggle(f, key, label){
  const on = !!f.planning.scopeFlags[key];
  return `<label class="tick ${on?'on':''}" onclick="Flights.toggleScope('${key}')" style="border-color:${on?'var(--blocker)':''}">
    <span class="box">${on?'!':''}</span><span class="txt">${label}<div class="n">Yes = outside our ReOC scope</div></span></label>`;
}

function aeroTableHtml(f){
  const rows = f.planning.aerodromes||[];
  if(!rows.length) return `<div class="muted" style="font-size:.82rem">No aerodromes added. Add at least one, or tick the “no aerodromes” box below.</div>`;
  return `<div class="rep">${rows.map((r,i)=>`<div class="rep-row">
    <div class="field" style="flex:2"><label>Aerodrome</label><input value="${U.esc(r.name||'')}" onchange="Flights.setAero(${i},'name',this.value)"></div>
    <div class="field"><label>Dist (NM)</label><input type="number" step="0.1" value="${r.distNm??''}" onchange="Flights.setAero(${i},'distNm',this.value)"></div>
    <div class="field"><label>CTAF freq</label><input value="${U.esc(r.ctaf||'')}" onchange="Flights.setAero(${i},'ctaf',this.value)"></div>
    <div class="field" style="flex:2"><label>Notes</label><input value="${U.esc(r.notes||'')}" onchange="Flights.setAero(${i},'notes',this.value)"></div>
    <button class="rowbtn del" onclick="Flights.delAero(${i})">Remove</button></div>`).join('')}</div>`;
}
function hazTableHtml(f){
  const rows = f.planning.jsa.hazards||[];
  if(!rows.length) return `<div class="muted" style="font-size:.82rem">No hazards added. At least one hazard row is required.</div>`;
  return `<div class="rep">${rows.map((r,i)=>`<div class="rep-row">
    <div class="field" style="flex:2"><label>Hazard</label><input value="${U.esc(r.hazard||'')}" onchange="Flights.setHaz(${i},'hazard',this.value)"></div>
    <div class="field"><label>Residual risk</label><select onchange="Flights.setHaz(${i},'risk',this.value)">${['','Low','Med','High'].map(o=>`<option ${r.risk===o?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field" style="flex:2"><label>Control measure</label><input value="${U.esc(r.control||'')}" onchange="Flights.setHaz(${i},'control',this.value)"></div>
    <button class="rowbtn del" onclick="Flights.delHaz(${i})">Remove</button></div>`).join('')}</div>`;
