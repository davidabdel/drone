 managing the RPA operations of {ABC RPA}. Without limiting the duties and accountabilities of the CRP, the CRP must:"},{"type":"li","text":"ensure that RPA operations are conducted IAW relevant civil aviation legislation"},{"type":"li","text":"ensure that pilots and crew are suitably qualified and have appropriate experience and skills to enable them to satisfactorily fulfil the duties of their position"},{"type":"li","text":"maintain a record of qualifications held by the RP and OC"},{"type":"li","text":"monitor the operational standards and proficiency of the RP and OC"},{"type":"li","text":"review compliance and facilities by:"},{"type":"li","text":"conducting internal audits"},{"type":"li","text":"reviewing audit findings"},{"type":"li","text":"taking any necessary corrective action to rectify deficiencies as soon as possible."},{"type":"li","text":"review scheduling and rostering of crew to ensure that fatigue does not adversely affect the safety of operations"},{"type":"li","text":"provide the RP and OC with ready access to all documents and manuals necessary to ensure the safety of all flights"},{"type":"li","text":"advise the CEO of any matter pertaining to RPA operations that is relevant to the CEO’s duties."},{"type":"h","level":5,"text":"Maintenance controller (MC)","id":"maintenance-controller-mc"},{"type":"p","text":"The MC is responsible for ensuring that {ABC RPA}’s operating RPAS are properly maintained. Without limiting the duties and accountabilities of the MC, the MC must:"},{"type":"li","text":"control all RPAS maintenance, either scheduled or unscheduled"},{"type":"li","text":"keep records of all personnel permitted to perform maintenance on RPA, including details of their training and qualifications"},{"type":"li","text":"develop, enforce and monitor RPAS maintenance standards"},{"type":"li","text":"maintain a record of RPAS defects and unserviceability issues"},{"type":"li","text":"ensure that each item of equipment essential to the operation of {ABC RPA}’s RPA is serviceable before being released to service"},{"type":"li","text":"maintain a thorough technical knowledge of RPAS operating under the authority of the ReOC of {ABC RPA}"},{"type":"li","text":"ensure that all maintenance activities are conducted IAW the procedures detailed in Section 3 of this manual"},{"type":"li","text":"investigate all significant defects in the RPAS"},{"type":"li","text":"monitor the failure rates of RPAS components and impose additional maintenance requirements as necessary to ensure the safety of operations."},{"type":"h","level":4,"text":"Changing key personnel","id":"changing-key-personnel"},{"type":"p","text":"A change of key personnel is considered a significant change and requires prior approval from CASA. Wherever possible, the CEO will ensure the change of personnel is approved by CASA prior to the holder of a key position vacating that position."},{"type":"h","level":3,"text":"Operations manual administration","id":"operations-manual-administration"},{"type":"h","level":4,"text":"Access and distribution","id":"access-and-distribution"},{"type":"p","text":"This manual is maintained electronically at {electronic document location}. Copies of this manual that are not accessed directly from the system are designated as uncontrolled. Uncontrolled copies of the manual are not to be used unless the copy is verified to be identical to the current edition of the manual stored in the system."},{"type":"p","text":"All personnel must provide a written acknowledgement (an electronic acknowledgement such as an email is permitted) to the CRP stating that they have accessed, read and understood this manual before carrying out any duty essential to the control or navigation of an RPA."},{"type":"h","level":4,"text":"Continuous improvement","id":"continuous-improvement"},{"type":"p","text":"This manual must reflect the practices and procedures of {ABC RPA} and will be amended to facilitate any changes. Staff are encouraged to consider improvements in practices and procedures, and to provide suggestions to the CRP. All errors in the manual must be reported to the CRP as soon as practicable."},{"type":"p","text":"Planned changes to operational practices and procedures must be incorporated into this manual before implementing the change (see Section 1.3.3 of this manual)."},{"type":"p","text":"The CRP must review the operations suite of documents at least annually to ensure the relevance and currency of all procedures, and to achieve full compliance with legislative requirements."},{"type":"h","level":4,"text":"Amendment procedure","id":"amendment-procedure"},{"type":"p","text":"Prior to making a significant change to the operation including to this manual, the CRP must submit a draft of the sections with proposed changes to CASA for approval. Only after the change is approved by CASA is the amendment to be incorporated into the manual."},{"type":"p","text":"The CRP may make non-significant changes to this manual without approval from CASA."},{"type":"p","text":"For all changes, whether significant or non-significant, the CRP must provide a copy of the updated manual to CASA within 21 days of the change being made."},{"type":"p","text":"Amended versions of this manual must include the date and have a new version number assigned. Details of the amendment must be recorded in the Amendment record table on page 5 in this manual. The amended manual must be uploaded to {electronic document location}."},{"type":"p","text":"The CRP must ensure that a notification is sent to all personnel summarising all changes. This includes details and background on why the change was made, the delayed effective date for any changes (if applicable), the reasons for the changes, and any implications for staff."},{"type":"p","text":"All personnel are required to provide a written acknowledgement (an electronic acknowledgement such as an email is permitted) of having read and understood the amendment prior to carrying out any duty essential to the control or navigation of an RPA after the effective date of the amendment."},{"type":"h","level":3,"text":"Record keeping and management","id":"record-keeping-and-management"},{"type":"h","level":4,"text":"Control of records","id":"control-of-records"},{"type":"p","text":"All records are stored electronically on {electronic document location}. Records fall into 4 categories:"},{"type":"li","text":"Personnel records"},{"type":"li","text":"Flight-related records"},{"type":"li","text":"RPA-related records"},{"type":"li","text":"Administrative records."},{"type":"p","text":"The CRP is responsible for managing personnel, flight-related and administrative records. The MC is responsible for managing RPA-related records."},{"type":"p","text":"The record-keeping templates at F must be used at all times."},{"type":"h","level":4,"text":"Required records and retention","id":"required-records-and-retention"},{"type":"caption","text":"Table 3: Personnel records"},{"type":"table","rows":[["Type of record","Minimum retention period"],["Training event","7 years after date on which the record was made"],["Checking event","7 years after date on which the record was made"],["Attainment of RP qualification (including relevant qualifications held before commencement of employment)","7 years after date of the RP’s last operation of an RPA for {ABC RPA}"],["Attainment of qualification of competency in relation to the safety of RPA operations (other than RP duties)","7 years after date on which the person ceases to be employed by {ABC RPA}"],["RP logbook*","7 years after date of the RP’s last operation of an RPA for {ABC RPA}"]]},{"type":"note","text":"* Accumulated flight experience (including experience held before commencement of employment) to be maintained by the RP – see Section 10.06 of Chapter 10 Division 2 of the Part 101 MOS for minimum requirements."},{"type":"caption","text":"Table 4: Flight-related records"},{"type":"table","rows":[["Type of record","Minimum retention period"],["Flight Record (Form F1)","7 years after date on which the record was made"],["Written consent to operate at a distance of less than 30 metres from a person","7 years after date on which the consent was provided"]]},{"type":"note","text":"Note: The Flight Record includes and combines the job safety assessment (JSA), authorised RPAS operational release and RPAS operational log."},{"type":"caption","text":"Table 5: RPA-related records"},{"type":"table","rows":[["Type of record","Minimum retention period"],["RPAS Technical Log (Form F2)","7 years after the last time the RPA is operated by the operator"],["Register of RPA operated by {ABC RPA} including manufacturer, model, maximum gross weight and serial number","7 years after date on which the record was made"]]},{"type":"caption","text":"Table 6: Administrative records"},{"type":"table","rows":[["Type of record","Minimum retention period"],["Acknowledgement of access to and understanding of {ABC RPA} operations manual version","7 years after the acknowledgement is made"],["Register of persons (other than the CRP) permitted to conduct training and checking (if applicable)","7 years after the last time training or checking is provided by the trainer"],["Compliance audit record (see Section 1.6.1 of this manual)","7 years from the date of the audit"],["Risk register","For each version of the register, 12 months after a new version is issued"],["Safety occurrence register","For each safety occurrence entry in the register, 7 years from date of occurrence"]]},{"type":"h","level":3,"text":"Internal training","id":"internal-training"},{"type":"h","level":4,"text":"Persons permitted to conduct training","id":"persons-permitted-to-conduct-training"},{"type":"p","text":"Only the CRP and persons nominated in writing by the CRP are permitted to provide internal training. Before authorising a person to conduct training, the CRP must ensure that appropriate measures of competency are in place to guarantee the effectiveness and comprehensiveness of all training delivered."},{"type":"h","level":4,"text":"Initial training","id":"initial-training"},{"type":"p","text":"All personnel must complete induction training and assessment to ensure they have a thorough understanding of the task requirements and responsibilities of their role. Training syllabuses and minimum proficiency requirements are detailed at Appendix G."},{"type":"h","level":4,"text":"Type and complex operations training","id":"type-and-complex-operations-training"},{"type":"p","text":"Additional training and proficiency assessment appropriate to the task are required before personnel:"},{"type":"li","text":"undertake a new complex operation – that is, an operation outside of the standard operating conditions (SOC)"},{"type":"li","text":"operate a new RPA type."},{"type":"p","text":"Training syllabuses and minimum proficiency requirements are detailed at Appendix G."},{"type":"h","level":3,"text":"Internal audit process","id":"internal-audit-process"},{"type":"h","level":4,"text":"Operations manual and regulatory compliance","id":"operations-manual-and-regulatory-compliance"},{"type":"p","text":"At appropriate intervals, the CRP will carry out a compliance audit on a representative sample of processes and procedures. At a minimum, the audit must assess the:"},{"type":"li","text":"accessibility and awareness of the current operations manual by all personnel"},{"type":"li","text":"accuracy and completeness of flight records and aircraft logs"},{"type":"li","text":"records of pilot training, proficiency checks and qualifications."},{"type":"h","level":4,"text":"Monitoring operational standards","id":"monitoring-operational-standards"},{"type":"p","text":"At appropriate intervals, the CRP will conduct observation flights (a checking event) with each RP and OC in a representative sample of operations to assess their operational competence and compliance with the operations manual and relevant aviation legislation."},{"type":"p","text":"The CRP must report to the CEO confirming that the operational standards are being maintained and that corrective action (if required) is being taken."},{"type":"h","level":3,"text":"Fitness for duty","id":"fitness-for-duty"},{"type":"p","text":"All {ABC RPA} personnel are prohibited from performing any task related to the safety or navigation of an RPA when unfit to perform that activity. Without limiting the definition, a person is taken to be, or is taken to be likely to be, unfit to perform a duty if:"},{"type":"li","text":"they are unwell or fatigued to the extent that their capacity to safely perform the duty is reduced or likely to be reduced, and/or"},{"type":"li","text":"their capacity to safely perform the duty is impaired, or likely to be impaired, because they have consumed, used, or absorbed a psychoactive substance (including alcohol), or they have an illness or injury, and/or"},{"type":"li","text":"their capacity to safely perform their duty is impaired, or likely to be impaired, because they have consumed prescription or over-the-counter medication (such as codeine and antihistamine) that can cause adverse side effects such as drowsiness."},{"type":"p","text":"{ABC RPA} personnel must immediately report any potential or actual unfitness for duty to the CRP who will take appropriate action to remedy the situation."},{"type":"h","level":3,"text":"Recency requirements","id":"recency-requirements"},{"type":"p","text":"RESERVED"},{"type":"h","level":3,"text":"Safety occurrence reporting","id":"safety-occurrence-reporting"},{"type":"p","text":"All personnel must report any safety occurrence to the CRP as soon as practicable."},{"type":"p","text":"The CRP must ensure that the following occurrences are reported to the ATSB."},{"type":"caption","text":"Table 7: Safety occurrence reporting"},{"type":"table","rows":[["Occurrence","Reporting requirement"],["Death or serious injury to a person","Report as soon as is reasonably practicable by phoning 1800 011 034 Follow up with a written report within 72 hours to Occurrence Notification - Aviation | ATSB"],["RPA missing RPA suffering serious damage (or reasonable grounds to believe it may be seriously damaged) RPA inaccessible with reasonable grounds to believe it may be seriously damaged Serious property damage Loss of separation","Submit a written report within 72 hours to Occurrence Notification - Aviation | ATSB"]]},{"type":"p","text":"All personnel must take reasonable steps to preserve any flight planning and operational data, telemetry logs and RPAS components that may assist in determining the cause of an occurrence."},{"type":"h","level":2,"text":"RPA operations","id":"rpa-operations"},{"type":"h","level":3,"text":"Risk assessment","id":"risk-assessment"},{"type":"h","level":4,"text":"Risk criteria","id":"risk-criteria"},{"type":"p","text":"{ABC RPA} will only conduct operations if they can be conducted without an unacceptable safety risk to the RPA or any person or other property, and when they do not impose a hazard on the safety of air navigation."},{"type":"h","level":4,"text":"Risk register","id":"risk-register"},{"type":"p","text":"The CRP must maintain a risk register that covers all operational profiles conducted by {ABC RPA}. The risk rating criteria and a template risk register are at Appendix E."},{"type":"p","text":"All current controls listed in the risk register must be linked to a procedure in this manual or a legislative requirement. Where an additional control is implemented, the control is to be included in the next amendment of the operations manual."},{"type":"p","text":"To ensure the accuracy of risk identification and adequacy of controls, the risk register must be reviewed and updated:"},{"type":"li","text":"prior to {ABC RPA} commencing a new operational profile (for example, an operation requiring a different type of official authorisation)"},{"type":"li","text":"after any ATSB reportable safety occurrence"},{"type":"li","text":"at least annually."},{"type":"note","text":"Note: {ABC RPA} uses the risk assessment and mitigation methodology contained in the CASA safety management system (SMS) kit at http://casa.gov.au/sms."},{"type":"h","level":3,"text":"Planning","id":"planning"},{"type":"h","level":4,"text":"Documentation","id":"documentation"},{"type":"p","text":"A Flight Record must be created for all operations. Section 2 of the Flight Record contains a JSA assessment which must be completed for any operation:"},{"type":"li","text":"in RPA above 2 kg"},{"type":"li","text":"outside the SOC"},{"type":"li","text":"where an official authorisation is required."},{"type":"p","text":"Operations in RPA weighing 2 kg or less and operating IAW the SOC must consider the items listed in Section 2 of the Flight Record before commencement of operations."},{"type":"h","level":4,"text":"Operations requiring an official authorisation","id":"operations-requiring-an-official-authorisation"},{"type":"p","text":"Where an operation requires an official authorisation, the JSA must include details of any additional risk control. Applications for an official authorisation must be made by the CRP."},{"type":"p","text":"Where an official authorisation is provided, the RP must ensure that they have read and understood the authorisation before the commencement of operations. The RP must comply with any condition detailed in the authorisation, unless doing so would have a negative impact on aviation safety, in which case they must immediately cease the operation and advise the CRP of the issue as soon as practicable."},{"type":"p","text":"Copies of all current official authorisation are available at {electronic document location}."},{"type":"h","level":4,"text":"Flight authorisation","id":"flight-authorisation"},{"type":"p","text":"All operations require authorisation by the CRP. Before authorising an operation, the CRP must review the planning section of the Flight Record to ensure the operation will comply with legislation and meet an acceptable risk profile."},{"type":"p","text":"A flight authorisation expires on any changes to:"},{"type":"li","text":"the RPA"},{"type":"li","text":"the crew"},{"type":"li","text":"the location"},{"type":"li","text":"authorised dates and times."},{"type":"h","level":3,"text":"Before flight","id":"before-flight"},{"type":"h","level":4,"text":"Validation of operational documentation","id":"validation-of-operational-documentation"},{"type":"p","text":"Before commencement of operations, the RP must conduct an onsite validation of the operational planning documentation, and local environmental considerations. The onsite validation must be recorded in Section 4 of the Flight Record before commencement of operations. Any variable outside of the flight authorisation or manufacturer limitations requires an updated flight authorisation before operating."},{"type":"h","level":4,"text":"Pre-operational briefing","id":"pre-operational-briefing"},{"type":"p","text":"When an operation involves more than one person, the RP must conduct a pre-operational briefing covering details of:"},{"type":"li","text":"the operation"},{"type":"li","text":"emergency procedures"},{"type":"li","text":"hazards"},{"type":"li","text":"crew responsibilities."},{"type":"p","text":"All personnel relevant to the operation must attend the briefing."},{"type":"h","level":4,"text":"Pre-operational serviceability","id":"pre-operational-serviceability"},{"type":"p","text":"Before commencement of the first flight of the day, a serviceability inspection must be completed IAW Section 3.1.2 of this manual. A checklist should be used to ensure all inspection items are covered. Details of the inspection including any identified defects must be recorded in the RPAS Technical Log before commencement of operations."},{"type":"p","text":"A pre-flight inspection should also be undertaken before each take-off. Any defects identified during operations are to be entered into the RPAS Technical Log as soon as practicable, and reported to the MC."},{"type":"p","text":"RPs must ensure that all major defects or outstanding maintenance actions previously detailed in the RPAS Technical Log have been addressed before a flight. Operations may proceed with minor defects, and these must be assessed and monitored."},{"type":"note","text":"Note: A minor defect is a defect that will not affect the safety of the aircraft or cause the aircraft to become a danger to persons or property."},{"type":"h","level":3,"text":"Flight operations","id":"flight-operations"},{"type":"h","level":4,"text":"RPAS documentation and instructions","id":"rpas-documentation-and-instructions"},{"type":"p","text":"All RPA must be operated IAW the manufacturer’s instructions and checklists, or an alternative procedure approved by the CRP."},{"type":"p","text":"Where an alternative RPA operating procedure has been approved, the procedure will be detailed at Appendix B. Before approving an alternative procedure, the CRP must conduct a risk assessment to assess the impact of the changed procedure on the safety of flight operations."},{"type":"h","level":4,"text":"Ensuring operations do not pose a hazard","id":"ensuring-operations-do-not-pose-a-hazard"},{"type":"p","text":"The RP is responsible for ensuring that the RPA is not operated in such a way as to create a hazard to another aircraft, person or property."},{"type":"p","text":"To reduce the potential for conflict with other aircraft, the RP should not operate the RPA within 500 ft vertically or 1500 m horizontally of any airborne conventionally piloted aircraft unless approved by the CRP."},{"type":"p","text":"The RP must ensure that the prevailing meteorological conditions allow for visual separation from obstacles and other airspace users unless otherwise approved by CASA."},{"type":"h","level":4,"text":"Aeronautical radio usage","id":"aeronautical-radio-usage"},{"type":"p","text":"Only personnel who are qualified under Part 61 or Part 64 of CASR may use an aeronautical radio."},{"type":"p","text":"Use of an aeronautical radio is required for all operations in RPA with a gross weight > 2 kg within controlled airspace or outside of the SOC."},{"type":"p","text":"Radio broadcasts must be made:"},{"type":"li","text":"in controlled airspace: only where required or directed by ATC or CASA, or where necessary to resolve a potential conflict with a crewed aircraft"},{"type":"li","text":"in uncontrolled airspace: where necessary to resolve a potential conflict with a crewed aircraft."},{"type":"p","text":"Where carriage of an aeronautical radio is not mandatory, the RP should consider the benefits to situational awareness, and operate an aeronautical radio where appropriate."},{"type":"h","level":4,"text":"Use of transponder","id":"use-of-transponder"},{"type":"p","text":"A transponder / ADS-B (out)fitted to the RPA must not be activated unless specifically requested by air traffic control or IAW an official authorisation."},{"type":"h","level":4,"text":"Transportation of dangerous goods","id":"transportation-of-dangerous-goods"},{"type":"p","text":"RPAS are subject to the requirements of the dangerous goods legislation. The RP must ensure that RPA do not carry dangerous goods."},{"type":"note","text":"Note:When travelling to site, limitations apply to the carriage of dangerous goods, including batteries, on commercial aircraft. Crew are reminded of their obligations to comply with the carrier’s dangerous goods policy."},{"type":"h","level":4,"text":"Operations near people","id":"operations-near-people"},{"type":"p","text":"The RP must ensure that an RPA is not operated within 30 m laterally of any person. This is measured from the point on the ground directly below the RPA to the position of any person who is not directly involved in the control or navigation of the RPA."},{"type":"note","text":"Note:Persons being filmed or photographed – such as actors, athletes or members of the public – are not considered essential to the control and navigation of the RPA."},{"type":"p","text":"Operations within 30 m but not less than 15 m of a person are permitted if all these criteria are satisfied:"},{"type":"li","text":"A risk assessment has been completed, with appropriate mitigators implemented for the level and type of risk identified."},{"type":"li","text":"The person is advised of any identified risks and given details of implemented mitigation strategies."},{"type":"li","text":"The person is advised of the requirement for {ABC RPA} to obtain the person’s consent to operate within 30m of them."},{"type":"li","text":"The person provides consent for {ABC RPA} to operate within 30 m of them."},{"type":"p","text":"Any consent to operate within 30 m of a person must be provided in writing."},{"type":"note","text":"Note: A body corporate or any other entity cannot give such consent on behalf of any individual."},{"type":"p","text":"The RP must also ensure an RPA (other than a micro RPA) that is not a certificated RPA is not operated over a populous area at a height less than the height from which, if any of its components fails, it would be able to clear the area."},{"type":"p","text":"The RP may operate a certificated RPA over a populous area at a height less than the height from which, if any of its components fails, it would be able to clear the area, with a CASA approval."},{"type":"p","text":"An area is a populous area in relation to the operation of an unmanned aircraft if the area has a sufficient density of population for some aspect of the operation, or some event that might happen during the operation (in particular, a fault in, or failure of, the aircraft) to pose an unreasonable risk to the life, safety or property of somebody who is in the area but is not connected with the operation."},{"type":"h","level":4,"text":"Operations near aerodromes","id":"operations-near-aerodromes"},{"type":"p","text":"The RP must not operate an RPA:"},{"type":"li","text":"over a movement area of an aerodrome"},{"type":"li","text":"within the no-fly zone of a controlled aerodrome"},{"type":"li","text":"within the relevant airspace of a non-controlled aerodrome during a relevant event"},{"type":"p","text":"unless the RPA is operated:"},{"type":"li","text":"IAW an official authorisation"},{"type":"li","text":"indoors IAW Section 2.4.11"},{"type":"li","text":"tethered IAW Section Error! Reference source not found.."},{"type":"h","level":4,"text":"Operations at night","id":"operations-at-night"},{"type":"p","text":"Operations at night are conducted under the generic night approval CASA 01/17 – Approval Operation of RPA at Night (available at {electronic document location}). Schedule 2 of the approval instrument contains equipment and environmental conditions which must be followed by the RP. Details of how the conditions will be met for the operation – and of mitigations for any additional risks – should be included in the JSA."},{"type":"p","text":"Only the CRP and RPs who have completed the night operations training and proficiency assessment (IAW Section 1.5 of this manual) are permitted to operate RPA at night."},{"type":"h","level":4,"text":"Operations above 400 ft AGL","id":"operations-above-400-ft-agl"},{"type":"p","text":"Operations above 400 ft AGL (measured from the point directly below the RPA) require an official authorisation. Before seeking an authorisation, the CRP will conduct an assessment to identify any additional risks and the appropriate controls. Items to be considered include:"},{"type":"li","text":"proximity to obstacles (shielding)"},{"type":"li","text":"crewed aircraft flight paths"},{"type":"li","text":"ability to maintain VLOS"},{"type":"li","text":"aeronautical radio requirements"},{"type":"li","text":"NOTAM requirements"},{"type":"li","text":"environmental conditions."},{"type":"h","level":4,"text":"Operations outside of VLOS","id":"operations-outside-of-vlos"},{"type":"p","text":"{ABC RPA} is not approved to conduct operations outside of VLOS."},{"type":"h","level":4,"text":"Indoor (contained) operations","id":"indoor-contained-operations"},{"type":"p","text":"Where the conditions require the RPA to be operated as an indoor (contained) operation, the RP must ensure that it is physically impossible for the RPA to escape the containment area and fly away. Further, the RP must ensure that if the RPA collides with any part of the containment area, no material from the RPA or containment area can move or escape and cause injury to a person or property outside the area."},{"type":"p","text":"Details of the containment area and any additional controls required to keep the RPA within the area must be included in the Flight Record."},{"type":"h","level":4,"text":"Tethered operations","id":"tethered-operations"},{"type":"p","text":"RESERVED"},{"type":"h","level":3,"text":"Post-flight administration","id":"post-flight-administration"},{"type":"p","text":"At the completion of operations, the RP must complete the remaining items in Section 4 of the Flight Record. The completed Flight Record must be uploaded to {electronic document location}."},{"type":"p","text":"As soon as practicable following each operation, the RP must ensure that ‘time in service’ and any known defects are recorded in the RPAS Technical Log."},{"type":"h","level":3,"text":"Emergency procedures","id":"emergency-procedures"},{"type":"h","level":4,"text":"Emergency management","id":"emergency-management"},{"type":"p","text":"The emergency response for all RPA emergencies is to return the RPA to the ground in a safe location, where possible without damage to the RPA, in this sequence:"},{"type":"li","text":"Maintain control of the RPA"},{"type":"li","text":"Manoeuvre the RPA to a safe location"},{"type":"li","text":"Land the RPA."},{"type":"p","text":"Depending on the emergency, the RP may use automation or manual flight control to manage the situation."},{"type":"p","text":"Expanded emergency procedures and checklists specific to the RPA may be applicable and these are outlined at Appendix B. Where the RPA has expanded emergency procedures, the RP must ensure that an emergency checklist is readily available."},{"type":"p","text":"Initial action principles should be used in all operations:"},{"type":"li","text":"For solo RPAS operations: Aviate, Navigate, Communicate, Administrate (ANCA)."},{"type":"li","text":"For multi-crew RPAS operations: Communicate (between crew), Aviate, Communicate (externally to ATC / relevant stakeholder) and Administrate (CANCA)."},{"type":"h","level":4,"text":"Flight termination","id":"flight-termination"},{"type":"p","text":"Where control of the RPA is irrecoverable, the RP should activate the flight termination system. The RP should consider the likely location and trajectory of the RPA prior to activating a flight termination system."},{"type":"p","text":"Avoiding injury to third parties and their property is paramount and must always be considered a higher priority than avoiding damage to the RPA."},{"type":"h","level":2,"text":"Maintenance","id":"maintenance"},{"type":"h","level":3,"text":"Maintenance schedules","id":"maintenance-schedules"},{"type":"h","level":4,"text":"Periodic inspection schedule","id":"periodic-inspection-schedule"},{"type":"p","text":"All RPA are maintained IAW the manufacturer’s maintenance schedule and procedures. The MC must detail any upcoming maintenance item in the RPAS Technical Log."},{"type":"h","level":5,"text":"Firmware and software","id":"firmware-and-software"},{"type":"p","text":"Updating of RPAS and control system software is considered a periodic maintenance item and must only be conducted as and when directed by the MC."},{"type":"h","level":4,"text":"Daily inspection schedule","id":"daily-inspection-schedule"},{"type":"p","text":"A serviceability inspection of the RPA must be completed before the commencement of that day’s flight operations IAW the manufacturer’s pre-flight inspection procedures. The daily inspection is considered to be a maintenance item."},{"type":"h","level":3,"text":"Maintenance authorisation","id":"maintenance-authorisation"},{"type":"h","level":4,"text":"Maintenance personnel","id":"maintenance-personnel"},{"type":"p","text":"Table 8 outlines the roles/entities that are authorised to conduct specified maintenance activities on RPAS."},{"type":"caption","text":"Table 8: Maintenance activities and personnel"},{"type":"table","rows":[["Person","Maintenance items"],["MC","All maintenance items"],["RP holding a valid RePL who has completed operator RPA type training","Daily inspection (including pre- and postflight) Replacement of propellers Replacement and charge of batteries Fitting and removal of payloads and role equipment Update of firmware/software"],["Organisations and service providers assessed by the MC as competent to provide RPAS maintenance services","All maintenance items"],["Manufacturers of RPAS items and their approved service agents","All maintenance items"],["Ground crew who have completed operator RPA type training","Daily inspection (including pre- and post-flight) Replacement of propellers Replacement and charge of batteries Fitting and removal of payloads and role equipment Update of firmware/software"]]},{"type":"h","level":3,"text":"Recording of defects and maintenance","id":"recording-of-defects-and-maintenance"},{"type":"p","text":"It is the responsibility of all personnel to report open defects to the MC as soon as practicable."},{"type":"p","text":"All maintenance (including daily inspections) must be recorded in the RPAS Technical Log."},{"type":"h","level":3,"text":"Post-maintenance test flights","id":"post-maintenance-test-flights"},{"type":"p","text":"Before an RPA is returned to service following any rectification or modification to the RPAS that has the potential to impact flight safety, a test flight must be completed by an appropriately licenced and competent RP to verify that the RPA operates correctly in all avai /* ================================================================ *
 *  OPERATIONS MANUAL — the digital RPAS Ops Manual.
 *  Document control + a live Schedule 1 / personnel roster pulled straight
 *  from Fleet/Personnel, plus a curated Amendment Record auto-populated by
 *  logOpsManualEntry() at the real actions that should update the manual
 *  (aircraft added/retired/re-serialled, maintenance/defects, personnel
 *  changes, CASA change events, ATSB occurrences) — plus manual entries
 *  for anything else worth recording.
 * ================================================================ */
const OpsManual = { catFilter:'', q:'' };

/* ---- content rendering: real manual text, live-data splices, placeholder highlighting ---- */
function omEsc(text){
  const org = (State.settings && State.settings.orgName) || '{ABC RPA}';
  let t = U.esc(text).split('{ABC RPA}').join('<b>'+U.esc(org)+'</b>');
  t = t.replace(/\{([^}]{1,80})\}/g, '<span class="om-fill" title="Fill this in — from the source CASA template">$1</span>');
  return t;
}
function omTableHtml(rows){
  if(!rows || !rows.length) return '';
  const [head,...body] = rows;
  return `<div class="tbl-wrap om-table-wrap"><table class="data om-table"><thead><tr>${head.map(c=>`<th>${omEsc(c)}</th>`).join('')}</tr></thead>
    <tbody>${body.length? body.map(r=>`<tr>${r.map(c=>`<td>${omEsc(c)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${head.length}" class="muted">No rows in the source template.</td></tr>`}</tbody></table></div>`;
}
function omLiveScheduleTable(){
  const drones = State.drones.filter(d=>d.status!=='Retired-Sold-Written off');
  return `<div class="om-live"><div class="om-live-tag">LIVE — FROM FLEET, NOT THE STATIC TEMPLATE</div>
    <div class="tbl-wrap"><table class="data"><thead><tr><th>Callsign</th><th>Make/Model</th><th>Serial</th><th>Type/category</th><th>MTOW</th><th>Status</th></tr></thead><tbody>
    ${drones.map(d=>`<tr><td><b>${U.esc(d.nickname)}</b></td><td>${U.esc(d.make+' '+d.model)}</td><td class="mono">${U.esc(d.serial)}</td><td style="font-size:.8rem">${U.esc(d.typeCategory||'')}</td><td>${d.mtowKg!=null?d.mtowKg+' kg':'—'}</td><td>${droneStatusPill(d)}</td></tr>`).join('')||'<tr><td colspan=6 class="muted">No active aircraft.</td></tr>'}
    </tbody></table></div></div>`;
}

// Heading id -> function producing the live HTML that replaces the corresponding
// blank template table from the source document (found dynamically below).
const OM_SPLICE = {
  'organisation-details': omLiveOrgDetailsTable,
  'amendment-record': omLiveAmendmentRecord,
  'list-of-key-personnel': omLivePersonnelTable,
  'list-of-rpa-operated-by-abc-rpa': omLiveScheduleTable
};
function omSpliceMap(){
  const map = {};
  OPS_MANUAL_CONTENT.forEach((o,i)=>{
    if(o.type==='h' && OM_SPLICE[o.id]){
      for(let j=i+1;j<OPS_MANUAL_CONTENT.length;j++){
        const b=OPS_MANUAL_CONTENT[j];
        if(b.type==='h') break;
        if(b.type==='table'){ map[j]=OM_SPLICE[o.id]; break; }
      }
    }
  });
  return map;
}
// Walk the whole manual once, grouping by level-2 heading into chapters, each
// with its rendered inner HTML (headings/paragraphs/lists/tables, with the
// three live splices substituted in place of their static template tables).
function omBuildChapters(){
  const splices = omSpliceMap();
  const chapters = []; let cur = null;
  let listBuf=[], listType=null;
  const flushList = ()=>{ if(listBuf.length && cur){ const tag=listType==='oli'?'ol':'ul'; cur.html += `<${tag} class="om-list">${listBuf.join('')}</${tag}>`; } listBuf=[]; listType=null; };
  OPS_MANUAL_CONTENT.forEach((o,i)=>{
    if(o.type==='h' && o.level===2){ flushList(); cur = {id:o.id, title:o.text, html:'', subCount:0}; chapters.push(cur); return; }
    if(!cur) return; // (nothing precedes the first chapter in this source)
    if(o.type==='li'||o.type==='oli'){ if(listType && listType!==o.type) flushList(); listType=o.type; listBuf.push(`<li>${omEsc(o.text)}</li>`); return; }
    flushList();
    if(o.type==='h'){ cur.subCount++; const tag='h'+Math.min(o.level,6); cur.html += `<${tag} id="om-${o.id}" class="om-h om-h${o.level}">${omEsc(o.text)}</${tag}>`; return; }
    if(o.type==='p'){ cur.html += `<p class="om-p">${omEsc(o.text)}</p>`; return; }
    if(o.type==='note'){ cur.html += `<div class="om-note">📝 ${omEsc(o.text)}</div>`; return; }
    if(o.type==='caption'){ cur.html += `<div class="om-caption">${omEsc(o.text)}</div>`; return; }
    if(o.type==='table'){ cur.html += splices[i] ? splices[i]() : omTableHtml(o.rows); return; }
  });
  flushList();
  return chapters;
}
function omBuildToc(){

Settings.saveOrg=async function(){
  const s=State.settings; const newOrg=$('#setOrg').value.trim(), newReoc=$('#setReoc').value.trim();
  if(!newOrg||!newReoc){ toast('Org name and ReOC number required','err'); return; }
  const newBn=$('#setBn').value.split(',').map(x=>x.trim()).filter(Boolean);
  if(newOrg!==s.orgName) await createChangeEvent({classification:'SIG',triggerType:'entity-name',description:`Legal entity name change: “${s.orgName}” → “${newOrg}” (CASA approval required)`});
  const added=newBn.filter(x=>!(s.businessNames||[]).includes(x)), removed=(s.businessNames||[]).filter(x=>!newBn.includes(x));
  for(const b of added) await createChangeEvent({classification:'SIG',triggerType:'business-name',description:`Registered business name added: “${b}” (CASA approval required)`});
  for(const b of removed) await createChangeEvent({classification:'SIG',triggerType:'business-name',description:`Registered business name removed: “${b}” (CASA approval required)`});
  Object.assign(s,{orgName:newOrg,reocNumber:newReoc,acn:$('#setAcn').value.trim(),orgArn:$('#setOrgArn').value.trim(),businessNames:newBn,address:$('#setAddr').value.trim(),updatedAt:U.nowISO()});
  await Store.put('settings',s);
  setOrgBrand(s.orgName, s.reocNumber);
  await audit('settings','settings','app','Organisation details updated');
  await recompute(); Views.settings(); toast('Saved'+((added.length||removed.length||newOrg!==State.settings.orgName)?' — CASA change event(s) created':''),'ok');
};

Settings.importBackup=async function(input){
  const file=input.files[0]; if(!file) return; input.value='';

  try{

Flights.setConfirmedMin=async(v)=>{ CUR.postFlight.confirmedMin=v===''?null:parseFloat(v); await saveFlight(CUR); };
Flights.flyAgain=async(id)=>{
  const f=State.flight(id);
  f.sorties.push(newSortie(f.sorties.length+1));
  f.status='PRE-FLIGHT IN PROGRESS'; // Part 1 already done -> jumps to Part 2
  await saveFlight(f,'fly-again','New sortie '+f.sorties.length); await recompute();
  toast('New sortie — pre-flight procedure','ok'); renderFlightFile();
};
Flights.confirmFlightTime=async(id)=>{
  const f=State.flight(id);
  for(let n=1;n<=8;n++){ if(!(f.postFlight.steps[n]&&f.postFlight.steps[n].ticked)){ toast('Complete step '+n+' first','err'); return; } }
  const totalMin=f.sorties.reduce((s,x)=>s+(x.durationMin||0),0);
  const confirmedMin=f.postFlight.confirmedMin??totalMin;
  if(confirmedMin!==totalMin && !f.postFlight.adjustReason){
    const reason=await confirmDialog({title:'Adjusted flight time',message:`You changed the flight time from ${totalMin} to ${confirmedMin} min. Record why.`,confirmLabel:'Save adjustment',requireReason:true});
    if(!reason) return; f.postFlight.adjustReason=reason;
  }
  const hours=confirmedMin/60;
  // add to airframe, pilot; batteries already cycled on takeoff
  const d=State.drone(f.droneId); if(d){ d.totalHours=Math.round(((d.totalHours||0)+hours)*100)/100; await saveEntity('drones','drones',d); }
  const p=State.person(f.pilotId); if(p){ p.totalHours=Math.round(((p.totalHours||0)+hours)*100)/100; p.lastFlightAt=U.nowISO(); await saveEntity('people','people',p); }
  f.postFlight.steps[9]={ticked:true,at:U.nowISO()}; f.postFlight.totalMin=confirmedMin; f.postFlight.done=true;
  await saveFlight(f,'flight-time','Flight time '+confirmedMin+' min added to totals'); await recompute();
  toast('Flight time recorded','ok'); renderFlightFile();
};

/* Mobile: copy each data-table's header labels onto its cells so the
   stacked-card layout (see @media max-width:600px) shows field names. */
function labelizeTables(root){
  (root||document).querySelectorAll('table.data').forEach(t=>{
    const heads=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    if(!heads.length) return;
    t.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{ if(heads[i]!=null && td.getAttribute('data-label')!==heads[i]) td.setAttribute('data-label', heads[i]); });
    });
  });
}
function initResponsiveTables(){
  const view=App.el('view'); if(!view) return;
  labelizeTables(view);
  // re-label whenever a view re-renders (childList only — setting attributes won't re-trigger)
  new MutationObserver(()=>labelizeTables(view)).observe(view,{childList:true,subtree:true});
}

/* ================================================================ *
 *  ASSISTANT — CASA/ReOC chat bubble
 *  Calls /api/ask (Vercel serverless fn). The fn grounds the model
 *  strictly in fetched CASA reference pages — see api/ask.js.
 * ================================================================ */
const Assistant = { open:false, history:[] };
Assistant.toggle = function(){
  Assistant.open = !Assistant.open;
  const panel = App.el('chatPanel');
  panel.classList.toggle('open', Assistant.open);
  if(Assistant.open){
    if(!Assistant.history.length) Assistant.renderEmpty();
    setTimeout(()=>{ const inp=App.el('chatInput'); if(inp) inp.focus(); }, 50);
  }
};
Assistant.renderEmpty = function(){
  App.el('chatMsgs').innerHTML = `<div class="chat-empty">Ask a question about CASA drone rules or your ReOC — e.g. <i>"If I only fly drones under 2kg, do I still need an ReOC?"</i><br><br>Answers are drawn only from casa.gov.au and cite their source. Always confirm anything safety- or compliance-critical directly with CASA.</div>`;
};
Assistant.send = async function(){
  const inp = App.el('chatInput');
  const q = inp.value.trim();
  if(!q) return;
  inp.value=''; inp.disabled=true;
  Assistant.history.push({role:'user', text:q});
  Assistant.renderHistory();
  const pendingId = 'pending-'+U.uid();
  Assistant.history.push({role:'bot', text:'Checking casa.gov.au…', pending:true, id:pendingId});
  Assistant.renderHistory();
  try{
    const fleet = (State.drones||[]).filter(d=>d.status!=='Retired-Sold-Written off')
      .map(d=>({nickname:d.nickname, make:d.make, model:d.model, mtowKg:d.mtowKg, status:d.status}));
    const r = await fetch('/api/ask', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q, fleet}) });
    const data = await r.json().catch(()=>({}));
    const msg = Assistant.history.find(m=>m.id===pendingId);
    if(r.ok && data.answer){ msg.text = data.answer; msg.pending=false; }
    else { msg.text = data.error || 'The assistant is unavailable right now.'; msg.pending=false; msg.err=true; }
  }catch(e){
    const msg = Assistant.history.find(m=>m.id===pendingId);
    msg.text = "Couldn't reach the assistant — check your connection and try again."; msg.pending=false; msg.err=true;
  }
  inp.disabled=false; inp.focus();
  Assistant.renderHistory();
};
Assistant.renderHistory = function(){
  const el = App.el('chatMsgs');
  el.innerHTML = Assistant.history.map(m=>{
    if(m.role==='user') return `<div class="chat-msg user">${U.esc(m.text)}</div>`;
    const cls = 'chat-msg bot'+(m.pending?' pending':'')+(m.err?' err':'');
    return `<div class="${cls}">${U.esc(m.text)}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
};

window.addEventListener('DOMContentLoaded', ()=>{ initResponsiveTables(); init().catch(e=>{ console.error(e); toast('Startup error: '+e.message,'err'); }); });
</script>
